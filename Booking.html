<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule a Measure | Drafting Services</title>
    <style>
        :root {
            --primary: #3e2723;
            --primary-light: #5d4037;
            --surface: rgba(255, 255, 255, 0.95);
            --border: #d7ccc8;
            --text: #263238;
            --accent: #2e7d32;
            --warning-bg: #ffebee;
            --warning-border: #ef5350;
            --warning-text: #c62828;
            --success-bg: #e8f5e9;
            --success-border: #a5d6a7;
            --success-text: #1b5e20;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: url('backgroundmain.png') no-repeat center center fixed; 
            background-size: cover;
            padding: 20px 10px; 
            color: var(--text);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .booking-card { 
            width: 100%;
            max-width: 550px; 
            background: url('textbackground.jpg') repeat;
            background-color: #fdfbf7;
            padding: 24px; 
            border-radius: 12px; 
            border: 1px solid var(--border);
            border-top: 8px solid var(--primary);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); 
            box-sizing: border-box;
        }

        h2 { 
            margin-top: 0; 
            font-weight: 400; 
            letter-spacing: 1.5px; 
            text-transform: uppercase; 
            border-bottom: 2px solid var(--primary); 
            padding-bottom: 12px; 
            text-align: center; 
            color: var(--primary); 
            font-size: 1.4em;
        }

        .section-label {
            display: block;
            margin-top: 18px;
            font-weight: 700;
            font-size: 0.8em;
            color: var(--primary-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea, select { 
            width: 100%; 
            padding: 12px; 
            margin-top: 6px; 
            border: 1px solid #bcaaa4; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 15px; 
            background: var(--surface); 
        }

        .segmented-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 6px;
        }

        .segmented-option { position: relative; }
        .segmented-option input { position: absolute; opacity: 0; }
        .segmented-label {
            display: block;
            background: var(--surface);
            border: 1px solid #bcaaa4;
            padding: 10px 0;
            border-radius: 6px;
            font-weight: bold;
            color: var(--primary-light);
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.88em;
        }

        .segmented-option input:checked + .segmented-label {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .address-group {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 6px;
        }
        .address-group input { margin-top: 0; flex: 1; }

        .check-btn {
            background: var(--primary-light);
            color: white;
            border: none;
            padding: 12px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75em;
            font-weight: bold;
            text-transform: uppercase;
            width: auto;
        }

        /* Outlook Date Strip */
        .date-strip-wrapper {
            width: 100%;
            overflow: hidden;
            margin-top: 6px;
        }

        .date-strip {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding: 6px 2px 12px 2px;
            min-height: 75px;
            box-sizing: border-box;
        }

        .date-pill {
            flex: 0 0 70px;
            height: 68px;
            padding: 8px 4px;
            text-align: center;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .date-pill .day-name { font-size: 0.72em; text-transform: uppercase; color: #78909c; font-weight: 700; }
        .date-pill .day-num { font-size: 1.25em; font-weight: 800; color: var(--primary); margin: 2px 0; }
        .date-pill .month-name { font-size: 0.68em; color: #546e7a; }

        .date-pill.selected {
            background: var(--primary) !important;
            border-color: var(--primary) !important;
            box-shadow: 0 4px 10px rgba(62,39,35,0.3);
        }
        .date-pill.selected .day-name, 
        .date-pill.selected .day-num, 
        .date-pill.selected .month-name { color: #ffffff !important; }

        /* Outlook Slot Grid */
        .time-slots-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 8px;
            background: rgba(255, 255, 255, 0.6);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            max-height: 230px;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .slot-btn {
            background: #ffffff;
            border: 1px solid #cfd8dc;
            padding: 6px 4px;
            border-radius: 6px;
            font-size: 0.82em;
            font-weight: 600;
            color: #37474f;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 48px;
            box-sizing: border-box;
        }

        .slot-btn:hover:not(.busy) {
            border-color: var(--primary);
            background: #efebe9;
        }

        .slot-btn.selected {
            background: var(--accent) !important;
            color: #ffffff !important;
            border-color: var(--accent) !important;
            box-shadow: 0 2px 6px rgba(46,125,50,0.3);
        }
        .slot-btn.selected .slot-loc { color: #e8f5e9 !important; }

        .slot-btn.busy {
            background: #eceff1;
            color: #78909c;
            border-color: #cfd8dc;
            cursor: not-allowed;
            opacity: 0.85;
        }

        .slot-btn.busy.buffer-slot {
            background: #f5f5f5;
            border: 1px dashed #b0bec5;
        }

        .slot-time { font-size: 0.92em; }
        .slot-loc {
            font-size: 0.68em;
            font-weight: 700;
            color: #8d6e63;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .slot-btn.busy.buffer-slot .slot-loc {
            color: #546e7a;
            font-weight: 600;
        }

        /* Travel Advisory Warning Box */
        .travel-alert {
            display: none;
            margin-top: 12px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.88em;
            line-height: 1.45;
            font-weight: 500;
            box-sizing: border-box;
            animation: popIn 0.2s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0.98); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .travel-alert.warning {
            background: var(--warning-bg);
            border: 2px solid var(--warning-border);
            color: var(--warning-text);
        }

        .travel-alert.ok {
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            color: var(--success-text);
        }

        .radio-group { 
            margin-top: 16px; 
            background: rgba(255, 255, 255, 0.6); 
            padding: 12px 14px; 
            border-radius: 6px; 
            border: 1px solid var(--border); 
        }
        .radio-option { display: flex; align-items: center; margin-bottom: 6px; font-size: 0.85em; font-weight: 500; cursor: pointer; }
        .radio-option input { width: auto; margin: 0 8px 0 0; accent-color: var(--primary); }

        button.submit-btn { 
            width: 100%; 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 16px; 
            margin-top: 20px; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            letter-spacing: 1.5px; 
            cursor: pointer; 
            text-transform: uppercase; 
            transition: all 0.2s;
        }
        button.submit-btn:hover:not(:disabled) { background: var(--primary-light); }
        button.submit-btn:disabled {
            background: #9e9e9e;
            cursor: not-allowed;
            opacity: 0.85;
        }
        button.submit-btn.btn-blocked {
            background: #c62828 !important;
        }
    </style>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAhbo0ldo8ZKcgMFprwszG720RykvvWO7Q"></script>
</head>
<body>

<div class="booking-card">
    <h2>Schedule a Measure</h2>
    <form id="measureForm">
        
        <label class="section-label">Salesperson</label>
        <div class="segmented-grid">
            <div class="segmented-option">
                <input type="radio" name="salesperson" id="sales_as" value="AS" required>
                <label for="sales_as" class="segmented-label">AS</label>
            </div>
            <div class="segmented-option">
                <input type="radio" name="salesperson" id="sales_bc" value="BC">
                <label for="sales_bc" class="segmented-label">BC</label>
            </div>
            <div class="segmented-option">
                <input type="radio" name="salesperson" id="sales_cl" value="CL">
                <label for="sales_cl" class="segmented-label">CL</label>
            </div>
            <div class="segmented-option">
                <input type="radio" name="salesperson" id="sales_df" value="DF">
                <label for="sales_df" class="segmented-label">DF</label>
            </div>
        </div>
        
        <label class="section-label">Customer Name</label>
        <input type="text" name="name" id="name" placeholder="Full Name" required>

        <label class="section-label">Phone Number</label>
        <input type="tel" name="phone" id="phone" placeholder="(555) 555-5555" required>

        <label class="section-label">Estimate Number (ES) <span style="font-weight: normal; font-size: 0.9em; color: #7d635c;">- Optional</span></label>
        <input type="text" name="estimate_number" id="estimate_number" placeholder="e.g., ES12345">

        <label class="section-label">Address</label>
        <div class="address-group">
            <input type="text" name="address" id="address" placeholder="Project Address (e.g., 442 E Clay Rd, Shelton WA)" required>
            <button type="button" class="check-btn" id="checkBtn">Test</button>
        </div>

        <label class="section-label">What are we measuring?</label>
        <textarea name="details" id="details" rows="2" placeholder="e.g., Kitchen & Bath LVP..."></textarea>

        <!-- Estimated Duration Selector -->
        <label class="section-label">Estimated Measure Duration</label>
        <div class="segmented-grid">
            <div class="segmented-option">
                <input type="radio" name="duration_minutes" id="dur_30" value="30">
                <label for="dur_30" class="segmented-label">30 Min</label>
            </div>
            <div class="segmented-option">
                <input type="radio" name="duration_minutes" id="dur_60" value="60" checked>
                <label for="dur_60" class="segmented-label">1 Hour</label>
            </div>
            <div class="segmented-option">
                <input type="radio" name="duration_minutes" id="dur_90" value="90">
                <label for="dur_90" class="segmented-label">1.5 Hours</label>
            </div>
            <div class="segmented-option">
                <input type="radio" name="duration_minutes" id="dur_120" value="120">
                <label for="dur_120" class="segmented-label">2 Hours</label>
            </div>
        </div>

        <!-- 1. Choose Date Carousel -->
        <label class="section-label">1. Choose Date</label>
        <div class="date-strip-wrapper">
            <div class="date-strip" id="dateStrip"></div>
        </div>

        <!-- 2. Select Time Slot -->
        <label class="section-label">2. Select Time Slot <span id="slotStatus" style="font-weight:normal; text-transform:none; color:#78909c;">⏳ Checking calendar...</span></label>
        <div class="time-slots-container" id="timeSlotsContainer">
            <div style="grid-column: span 3; text-align:center; color:#90a4ae; font-size:0.85em; padding:10px;">Loading calendar availability...</div>
        </div>

        <!-- Real-Time Drive Distance Alert Box -->
        <div id="travelAlert" class="travel-alert"></div>

        <input type="hidden" name="available_days" id="selectedDateInput" required>
        <input type="hidden" name="selected_time" id="selectedTimeInput" required>

        <div class="radio-group">
            <label style="margin-top:0; padding-bottom:8px; font-weight:700; font-size:0.75em; text-transform:uppercase;">Confirmation Preference</label>
            <label class="radio-option">
                <input type="radio" name="confirmation" value="Text Cell" checked> 
                This is a cell phone, please text to confirm.
            </label>
            <label class="radio-option">
                <input type="radio" name="confirmation" value="Phone Call"> 
                I would prefer a phone call to confirm.
            </label>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Confirm Booking</button>
    </form>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBIJQhVB5X9WLC2rwnhYX3otZito5vg1Pk",
      authDomain: "chickenmeasurer-37304.firebaseapp.com",
      projectId: "chickenmeasurer-37304",
      storageBucket: "chickenmeasurer-37304.firebasestorage.app",
      messagingSenderId: "871581751225",
      appId: "1:871581751225:web:bec4978ba235c1c4418868",
      measurementId: "G-Q6YZZ205BG"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const CALENDAR_ENDPOINT = "https://us-central1-chickenmeasurer-37304.cloudfunctions.net/getBusySlots";

    const TIME_SLOTS = [
        "8:30 AM", "9:00 AM", "9:30 AM", "10:00 AM", 
        "10:30 AM", "11:00 AM", "11:30 AM", "12:00 PM", 
        "12:30 PM", "1:00 PM", "1:30 PM", "2:00 PM", 
        "2:30 PM", "3:00 PM", "3:30 PM"
    ];

    let busySlots = [];
    let selectedDate = null;
    let selectedTime = null;
    let isDriveBlocked = false;
    const geoCache = {};

    function getSelectedDurationMinutes() {
        const checked = document.querySelector('input[name="duration_minutes"]:checked');
        return checked ? parseInt(checked.value, 10) : 60;
    }

    function timeStrToMinutes(timeStr) {
        const [time, modifier] = timeStr.trim().split(' ');
        let [hours, minutes] = time.split(':').map(Number);
        if (modifier === 'PM' && hours < 12) hours += 12;
        if (modifier === 'AM' && hours === 12) hours = 0;
        return hours * 60 + minutes;
    }

    function extractTownName(locationStr, summaryStr) {
        const target = (locationStr || summaryStr || "").toLowerCase();
        if (target.includes("shelton")) return "Shelton";
        if (target.includes("hawks prairie") || target.includes("hawks")) return "Hawks Prairie";
        if (target.includes("lacey")) return "Lacey";
        if (target.includes("olympia")) return "Olympia";
        if (target.includes("tumwater")) return "Tumwater";
        if (target.includes("yelm")) return "Yelm";
        if (target.includes("dupont")) return "DuPont";
        if (target.includes("rochester")) return "Rochester";
        if (target.includes("chehalis") || target.includes("centralia")) return "Centralia";
        
        if (locationStr && locationStr.length > 3) {
            return locationStr.split(",")[0].trim();
        }
        return "Measure";
    }

    function formatCleanAddress(addr) {
        let clean = addr.trim();
        if (!clean.toLowerCase().includes(" wa") && !clean.toLowerCase().includes("washington")) {
            clean += ", WA";
        }
        return clean;
    }

    async function geocodeAddress(addrStr) {
        const cleaned = formatCleanAddress(addrStr);
        if (geoCache[cleaned]) return geoCache[cleaned];

        return new Promise((resolve) => {
            const geocoder = new google.maps.Geocoder();
            geocoder.geocode({ address: cleaned }, (results, status) => {
                if (status === "OK" && results[0]) {
                    const coords = {
                        lat: results[0].geometry.location.lat(),
                        lng: results[0].geometry.location.lng()
                    };
                    geoCache[cleaned] = coords;
                    resolve(coords);
                } else {
                    resolve(null);
                }
            });
        });
    }

    function estimateDrive(coords1, coords2) {
        const R = 3958.8;
        const dLat = (coords2.lat - coords1.lat) * Math.PI / 180;
        const dLon = (coords2.lng - coords1.lng) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(coords1.lat * Math.PI / 180) * Math.cos(coords2.lat * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        const straightMiles = R * c;

        const roadMiles = straightMiles * 1.32;

        let mph = 32;
        if (roadMiles > 25) mph = 48;
        else if (roadMiles > 10) mph = 40;

        const durationMinutes = Math.round((roadMiles / mph) * 60);
        return { miles: Math.round(roadMiles * 10) / 10, minutes: durationMinutes };
    }

    function renderDateStrip() {
        const strip = document.getElementById('dateStrip');
        strip.innerHTML = '';
        const today = new Date();

        const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        let renderedCount = 0;
        for (let i = 0; i < 20 && renderedCount < 14; i++) {
            const d = new Date();
            d.setDate(today.getDate() + i);

            if (d.getDay() === 0) continue;

            const dateStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

            const pill = document.createElement('div');
            pill.className = 'date-pill';
            if (renderedCount === 0 && !selectedDate) {
                pill.classList.add('selected');
                selectedDate = dateStr;
                document.getElementById('selectedDateInput').value = dateStr;
            }

            pill.innerHTML = `
                <div class="day-name">${days[d.getDay()]}</div>
                <div class="day-num">${d.getDate()}</div>
                <div class="month-name">${months[d.getMonth()]}</div>
            `;

            pill.addEventListener('click', () => {
                document.querySelectorAll('.date-pill').forEach(p => p.classList.remove('selected'));
                pill.classList.add('selected');
                selectedDate = dateStr;
                document.getElementById('selectedDateInput').value = dateStr;
                selectedTime = null;
                document.getElementById('selectedTimeInput').value = '';
                hideTravelAlert();
                renderTimeSlots();
            });

            strip.appendChild(pill);
            renderedCount++;
        }
    }

    function renderTimeSlots() {
        const container = document.getElementById('timeSlotsContainer');
        container.innerHTML = '';
        if (!selectedDate) return;

        const [year, month, day] = selectedDate.split('-').map(Number);
        const BUFFER_MS = 30 * 60 * 1000;
        const durationMinutes = getSelectedDurationMinutes();
        const DURATION_MS = durationMinutes * 60 * 1000;

        let availableCount = 0;

        TIME_SLOTS.forEach(timeStr => {
            const minutes = timeStrToMinutes(timeStr);
            const slotStart = new Date(year, month - 1, day, Math.floor(minutes / 60), minutes % 60, 0);
            const slotEnd = new Date(slotStart.getTime() + DURATION_MS);

            if (minutes + durationMinutes > (16 * 60 + 30)) {
                return;
            }

            let conflictType = null;
            let conflictingEvent = null;

            for (const busy of busySlots) {
                const bActualStart = new Date(busy.start);
                const bActualEnd = new Date(busy.end);
                const bBufferStart = new Date(bActualStart.getTime() - BUFFER_MS);
                const bBufferEnd = new Date(bActualEnd.getTime() + BUFFER_MS);

                if (slotStart < bActualEnd && slotEnd > bActualStart) {
                    conflictType = 'event';
                    conflictingEvent = busy;
                    break;
                }
                if (slotStart < bBufferEnd && slotEnd > bBufferStart) {
                    conflictType = 'buffer';
                    conflictingEvent = busy;
                }
            }

            const btn = document.createElement('div');
            btn.className = `slot-btn ${conflictType ? 'busy' : ''} ${conflictType === 'buffer' ? 'buffer-slot' : ''}`;

            if (conflictType) {
                const town = extractTownName(conflictingEvent.location, conflictingEvent.summary);
                const labelText = conflictType === 'event' ? `📍 ${town} (Measure)` : `🚗 ${town} (Buffer)`;
                btn.innerHTML = `
                    <span class="slot-time">${timeStr}</span>
                    <span class="slot-loc">${labelText}</span>
                `;
            } else {
                availableCount++;
                btn.innerHTML = `<span class="slot-time">${timeStr}</span>`;
                
                if (selectedTime === timeStr) {
                    btn.classList.add('selected');
                }

                btn.addEventListener('click', () => {
                    document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedTime = timeStr;
                    document.getElementById('selectedTimeInput').value = timeStr;
                    triggerDriveCheck();
                });
            }

            container.appendChild(btn);
        });

        document.getElementById('slotStatus').innerText = `(${availableCount} available)`;
    }

    async function triggerDriveCheck() {
        const addressInput = document.getElementById('address');
        const submitBtn = document.getElementById('submitBtn');
        const currentAddr = addressInput ? addressInput.value.trim() : '';

        if (!currentAddr || !selectedTime || !selectedDate) {
            hideTravelAlert();
            return;
        }

        const [year, month, day] = selectedDate.split('-').map(Number);
        const minutes = timeStrToMinutes(selectedTime);
        const slotStart = new Date(year, month - 1, day, Math.floor(minutes / 60), minutes % 60, 0);
        const slotEnd = new Date(slotStart.getTime() + getSelectedDurationMinutes() * 60 * 1000);

        const dayEvents = busySlots.filter(ev => {
            const evStart = new Date(ev.start);
            return evStart.getFullYear() === slotStart.getFullYear() &&
                   evStart.getMonth() === slotStart.getMonth() &&
                   evStart.getDate() === slotStart.getDate();
        });

        if (dayEvents.length === 0) {
            hideTravelAlert();
            return;
        }

        let referenceEvent = null;
        let isPreceding = true;

        dayEvents.forEach(ev => {
            const evEnd = new Date(ev.end);
            if (evEnd <= slotStart) {
                if (!referenceEvent || evEnd > new Date(referenceEvent.end)) {
                    referenceEvent = ev;
                    isPreceding = true;
                }
            }
        });

        if (!referenceEvent) {
            dayEvents.forEach(ev => {
                const evStart = new Date(ev.start);
                if (evStart >= slotEnd) {
                    if (!referenceEvent || evStart < new Date(referenceEvent.start)) {
                        referenceEvent = ev;
                        isPreceding = false;
                    }
                }
            });
        }

        if (!referenceEvent || !referenceEvent.location || referenceEvent.location === "Scheduled Measure" || referenceEvent.location === "Booked") {
            hideTravelAlert();
            return;
        }

        const coordsOrigin = await geocodeAddress(referenceEvent.location);
        const coordsDest = await geocodeAddress(currentAddr);

        if (coordsOrigin && coordsDest) {
            const drive = estimateDrive(coordsOrigin, coordsDest);
            const refTown = extractTownName(referenceEvent.location, referenceEvent.summary);
            const relationText = isPreceding ? `from previous measure in` : `to next measure in`;

            if (drive.minutes > 30) {
                isDriveBlocked = true;
                showTravelAlert(
                    `⛔ <b>Route Blocked:</b> Estimated drive time is <b>${drive.minutes} mins</b> (${drive.miles} mi) ${relationText} <b>${refTown}</b>. Please choose a later slot to allow adequate drive time.`,
                    "warning"
                );
                submitBtn.disabled = true;
                submitBtn.classList.add('btn-blocked');
                submitBtn.innerText = "Cannot Book - Insufficient Travel Time";
            } else {
                isDriveBlocked = false;
                showTravelAlert(
                    `🚗 <b>Drive Buffer OK:</b> ~${drive.minutes} min drive (${drive.miles} mi) ${relationText} ${refTown}.`,
                    "ok"
                );
                submitBtn.disabled = false;
                submitBtn.classList.remove('btn-blocked');
                submitBtn.innerText = "Confirm Booking";
            }
        } else {
            hideTravelAlert();
        }
    }

    function showTravelAlert(html, type) {
        const alertBox = document.getElementById('travelAlert');
        alertBox.innerHTML = html;
        alertBox.className = `travel-alert ${type}`;
        alertBox.style.display = 'block';
    }

    function hideTravelAlert() {
        const alertBox = document.getElementById('travelAlert');
        const submitBtn = document.getElementById('submitBtn');
        alertBox.innerHTML = '';
        alertBox.style.display = 'none';
        isDriveBlocked = false;
        if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.classList.remove('btn-blocked');
            submitBtn.innerText = "Confirm Booking";
        }
    }

    document.querySelectorAll('input[name="duration_minutes"]').forEach(radio => {
        radio.addEventListener('change', () => {
            selectedTime = null;
            document.getElementById('selectedTimeInput').value = '';
            hideTravelAlert();
            renderTimeSlots();
        });
    });

    document.getElementById('address').addEventListener('input', () => {
        if (selectedTime) triggerDriveCheck();
    });

    document.getElementById('address').addEventListener('change', () => {
        if (selectedTime) triggerDriveCheck();
    });

    document.getElementById('checkBtn').addEventListener('click', async () => {
        const addressVal = document.getElementById('address').value;
        const btn = document.getElementById('checkBtn');
        if (!addressVal) return alert("Please enter an address first.");
        
        btn.innerText = "Checking...";
        const coords = await geocodeAddress(addressVal);
        if (coords) {
            alert("Address verified successfully!");
            btn.innerText = "Valid ✓";
            btn.style.background = "#2e7d32";
            triggerDriveCheck();
        } else {
            alert("Address not found in Washington. Please double-check spelling.");
            btn.style.background = "#c62828";
            btn.innerText = "Check";
        }
    });

    renderDateStrip();
    renderTimeSlots();

    async function initCalendarSync(retryCount = 0) {
        const slotStatus = document.getElementById('slotStatus');
        try {
            const res = await fetch(`${CALENDAR_ENDPOINT}?t=${Date.now()}`);
            if (res.ok) {
                const data = await res.json();
                busySlots = data.busySlots || [];
                renderTimeSlots();
            } else if (retryCount < 2) {
                setTimeout(() => initCalendarSync(retryCount + 1), 2000);
            }
        } catch (e) {
            console.warn("Calendar fetch retry...", e);
            if (retryCount < 2) {
                setTimeout(() => initCalendarSync(retryCount + 1), 2000);
            } else {
                if (slotStatus) slotStatus.innerText = "(Live sync unavailable - check Outlook)";
                renderTimeSlots();
            }
        }
    }
    initCalendarSync();

    const form = document.getElementById('measureForm');
    const container = document.querySelector('.booking-card');

    form.onsubmit = async (e) => {
        e.preventDefault();

        if (!selectedTime) {
            alert("Please pick an available time slot before submitting.");
            return;
        }

        if (isDriveBlocked) {
            alert("This time slot does not provide enough driving buffer from your other appointment. Please choose another time slot.");
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.innerText = "Booking Measure...";
        btn.disabled = true;

        const formDataObj = new FormData(form);
        const durMin = getSelectedDurationMinutes();
        const durText = durMin === 30 ? "30 min" : durMin === 60 ? "1 hr" : durMin === 90 ? "1.5 hr" : "2 hr";

        const submissionData = {
            salesperson: formDataObj.get('salesperson'),
            name: formDataObj.get('name'),
            phone: formDataObj.get('phone'),
            estimate_number: formDataObj.get('estimate_number') || "", 
            address: formDataObj.get('address'),
            details: formDataObj.get('details'),
            duration: durText,
            duration_minutes: durMin,
            available_days: formDataObj.get('available_days'),
            preferred_times: [formDataObj.get('selected_time')],
            confirmation: formDataObj.get('confirmation'),
            submitted_at: new Date().toLocaleString()
        };

        try {
            const cleanName = submissionData.name.trim().replace(/\s+/g, '_');
            const cleanPhone = submissionData.phone.replace(/\D/g, '');
            const customID = `${cleanName}_${cleanPhone}`;

            let coords = null;
            try {
                coords = await geocodeAddress(submissionData.address);
            } catch (err) {
                console.error("Geocoding failed", err);
            }

            await setDoc(doc(db, "submissions", customID), {
                ...submissionData,
                location: coords,
                timestamp: serverTimestamp()
            });

            await fetch("https://script.google.com/macros/s/AKfycbzaujNyeTmsyzjtaLIizlA4gAaDZrKC4_C73Y5fjtwo4rxAZ4XyFWisE1dyF-sMflM/exec", {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(submissionData),
                headers: { 'Content-Type': 'application/json' }
            });

            container.innerHTML = `
                <div style="text-align: center; padding: 40px 0;">
                    <h2 style="border:none;">Measure Scheduled!</h2>
                    <p style="font-size: 1.15em; color: #4e342e; line-height: 1.6;">
                        Booked for <b>${submissionData.available_days}</b> at <b>${submissionData.preferred_times[0]}</b> (${submissionData.duration}).<br>
                        Details saved & calendar invitation sent to Outlook.
                    </p>
                    <div style="font-size: 55px; margin: 20px 0;">📐📅✅</div>
                    <button onclick="location.reload()" style="background:none; color:#3e2723; text-decoration:underline; font-size: 0.9em; border:none; cursor:pointer;">Book another measure</button>
                </div>
            `;
        } catch (error) {
            console.error("Error:", error);
            alert("Oops! There was a problem booking the measure. Please try again.");
            btn.innerText = "Confirm Booking";
            btn.disabled = false;
        }
    };
</script>
</body>
</html>
