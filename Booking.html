<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule a Measure | Drafting Services</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            background: url('backgroundmain.png') no-repeat center center fixed; 
            background-size: cover;
            padding: 20px; 
            color: #263238;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container { 
            width: 100%;
            max-width: 500px; 
            background: url('textbackground.jpg'), url('https://www.toptal.com/designers/subtlepatterns/uploads/paper.png');
            background-blend-mode: overlay;
            background-size: cover;
            padding: 30px; 
            border-radius: 8px; 
            border: 1px solid #d7ccc8;
            border-top: 8px solid #3e2723;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); 
        }

        h2 { margin-top: 0; font-weight: 300; letter-spacing: 2px; text-transform: uppercase; border-bottom: 2px solid #3e2723; padding-bottom: 15px; text-align: center; color: #3e2723; }
        label { display: block; margin-top: 20px; font-weight: 700; font-size: 0.8em; color: #4e342e; text-transform: uppercase; }
        
        input, textarea, select { 
            width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #bcaaa4; 
            border-radius: 4px; box-sizing: border-box; font-size: 16px; 
            background: rgba(255, 255, 255, 0.85); 
        }

        .salesperson-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 8px;
        }

        .salesperson-option {
            position: relative;
            text-align: center;
        }

        .salesperson-option input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
            height: 0;
            width: 0;
        }

        .salesperson-label {
            display: block;
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid #bcaaa4;
            padding: 12px 0;
            border-radius: 4px;
            font-weight: bold;
            color: #4e342e;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95em;
        }

        .salesperson-option input:checked + .salesperson-label {
            background: #3e2723;
            color: white;
            border-color: #3e2723;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .address-group {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-top: 8px;
        }

        .address-group input {
            margin-top: 0;
            flex: 1;
        }

        .check-btn {
            background: #4e342e;
            color: white;
            border: none;
            padding: 12px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75em;
            font-weight: bold;
            text-transform: uppercase;
            transition: background 0.3s;
            width: 60px;
            white-space: nowrap;
        }

        .check-btn:hover {
            background: #5d4037;
        }

        .radio-group { 
            margin-top: 20px; 
            background: rgba(255, 255, 255, 0.5); 
            padding: 15px; 
            border-radius: 4px; 
            border: 1px solid #d7ccc8; 
        }

        .time-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .radio-option { 
            display: flex; 
            align-items: center; 
            margin-bottom: 8px; 
            cursor: pointer; 
            font-size: 0.85em; 
            font-weight: 500; 
        }
        .radio-option input { 
            width: auto; 
            margin-top: 0; 
            margin-right: 6px; 
            height: 16px; 
            width: 16px; 
            accent-color: #3e2723; 
        }

        /* Dim and strike-through unavailable Outlook slots */
        .radio-option.slot-busy {
            opacity: 0.4;
            text-decoration: line-through;
            cursor: not-allowed;
        }

        .slot-town-badge {
            font-size: 0.72em;
            font-weight: bold;
            color: #8d6e63;
            margin-left: 4px;
            text-decoration: none !important;
            display: inline-block;
        }

        /* Driving Advisory Warning Box */
        .travel-alert {
            display: none;
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 4px;
            background: #fff3e0;
            border: 1px solid #ffe0b2;
            color: #e65100;
            font-size: 0.82em;
            line-height: 1.4;
        }

        button.submit-btn { 
            width: 100%; background: #3e2723; color: white; border: none; padding: 18px; 
            margin-top: 30px; border-radius: 4px; font-size: 16px; font-weight: bold; 
            letter-spacing: 2px; cursor: pointer; text-transform: uppercase; transition: background 0.3s;
        }
        button.submit-btn:hover { background: #5d4037; }
    </style>
</head>
<body>

<div class="container">
    <h2>Schedule a Measure</h2>
    <form id="measureForm">
        
        <label>Salesperson</label>
        <div class="salesperson-grid">
            <div class="salesperson-option">
                <input type="radio" name="salesperson" id="sales_as" value="AS" required>
                <label for="sales_as" class="salesperson-label">AS</label>
            </div>
            <div class="salesperson-option">
                <input type="radio" name="salesperson" id="sales_bc" value="BC">
                <label for="sales_bc" class="salesperson-label">BC</label>
            </div>
            <div class="salesperson-option">
                <input type="radio" name="salesperson" id="sales_cl" value="CL">
                <label for="sales_cl" class="salesperson-label">CL</label>
            </div>
            <div class="salesperson-option">
                <input type="radio" name="salesperson" id="sales_df" value="DF">
                <label for="sales_df" class="salesperson-label">DF</label>
            </div>
        </div>
        
        <label>Customer Name</label>
        <input type="text" name="name" id="name" placeholder="Full Name" required>

        <label>Phone Number</label>
        <input type="tel" name="phone" id="phone" placeholder="(555) 555-5555" required>

        <label>Estimate Number (ES) <span style="font-weight: normal; font-size: 0.9em; color: #7d635c;">- Optional</span></label>
        <input type="text" name="estimate_number" id="estimate_number" placeholder="e.g., ES12345">

        <label>Address</label>
        <div class="address-group">
            <input type="text" name="address" id="address" placeholder="Project Address" required onchange="onAddressChanged()">
            <button type="button" class="check-btn" id="checkBtn" onclick="testAddress()">Test</button>
        </div>

        <label>What are we measuring?</label>
        <textarea name="details" id="details" rows="3" placeholder="e.g., Kitchen countertops..."></textarea>

        <label>Days you are available:</label>
        <input type="text" id="datePicker" name="available_days" placeholder="Tap to select dates" required>

        <label>Preferred Times <span id="calStatus" style="font-weight: normal; font-size: 0.8em; color: #7d635c;">(Select date to filter availability)</span></label>
        <div class="radio-group time-grid" id="timeGrid">
            <label class="radio-option"><input type="checkbox" name="time" value="8:30 AM"><span class="lbl-text">8:30 AM</span></label>
            <label class="radio-option"><input type="checkbox" name="time" value="9:00 AM"><span class="lbl-text">9:00 AM</span></label>
            <label class="radio-option"><input type="checkbox" name="time" value="9:30 AM"><span class="lbl-text">9:30 AM</span></label>
            <label class="radio-option"><input type="checkbox" name="time" value="10:00 AM"><span class="lbl-text">10:00 AM</span></label>
            <label class="radio-option"><input type="checkbox" name="time" value="10:30 AM"><span class="lbl-text">10:30 AM</span></label>
            <label class="radio-option"><input type="checkbox" name="time" value="11:00 AM"><span class="lbl-text">11:00 AM</span></label>
            <label class="radio-option"><input type="checkbox" name="time" value="11:30 AM"><span class="lbl-text">11:30 AM</span></label>
            <label class="radio-option"><input type="checkbox" name="time" value="12:00 PM"><span class="lbl-text">12:00 PM</span></label>
            <label class="radio-option"><input type="checkbox" name="time" value="12:30 PM"><span class="lbl-text">12:30 PM</span></label>
            <label class="radio-option"><input type="checkbox" name="time" value="1:00 PM"><span class="lbl-text">1:00 PM</span></label>
            <label class="radio-option"><input type="checkbox" name="time" value="1:30 PM"><span class="lbl-text">1:30 PM</span></label>
            <label class="radio-option"><input type="checkbox" name="time" value="2:00 PM"><span class="lbl-text">2:00 PM</span></label>
            <label class="radio-option"><input type="checkbox" name="time" value="2:30 PM"><span class="lbl-text">2:30 PM</span></label>
            <label class="radio-option"><input type="checkbox" name="time" value="3:00 PM"><span class="lbl-text">3:00 PM</span></label>
            <label class="radio-option"><input type="checkbox" name="time" value="3:30 PM"><span class="lbl-text">3:30 PM</span></label>
        </div>

        <div id="travelAlert" class="travel-alert"></div>

        <div class="radio-group">
            <label style="margin-top:0; padding-bottom:10px;">Confirmation Preference</label>
            <label class="radio-option">
                <input type="radio" name="confirmation" value="Text Cell" checked> 
                This is a cell phone, please text to confirm.
            </label>
            <label class="radio-option">
                <input type="radio" name="confirmation" value="Phone Call"> 
                I would prefer a phone call to confirm.
            </label>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Submit Request</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBIJQhVB5X9WLC2rwnhYX3otZito5vg1Pk",
      authDomain: "chickenmeasurer-37304.firebaseapp.com",
      projectId: "chickenmeasurer-37304",
      storageBucket: "chickenmeasurer-37304.firebasestorage.app",
      messagingSenderId: "871581751225",
      appId: "1:871581751225:web:bec4978ba235c1c4418868",
      measurementId: "G-Q6YZZ205BG"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const CALENDAR_ENDPOINT = "https://us-central1-chickenmeasurer-37304.cloudfunctions.net/getBusySlots";
    const GOOGLE_API_KEY = "AIzaSyAhbo0ldo8ZKcgMFprwszG720RykvvWO7Q";

    let busySlots = [];

    function timeStrToMinutes(timeStr) {
        const [time, modifier] = timeStr.trim().split(' ');
        let [hours, minutes] = time.split(':').map(Number);
        if (modifier === 'PM' && hours < 12) hours += 12;
        if (modifier === 'AM' && hours === 12) hours = 0;
        return hours * 60 + minutes;
    }

    function extractTownName(locationStr, summaryStr) {
        const target = (locationStr || summaryStr || "").toLowerCase();
        if (target.includes("shelton")) return "Shelton";
        if (target.includes("hawks prairie") || target.includes("hawks")) return "Hawks Prairie";
        if (target.includes("lacey")) return "Lacey";
        if (target.includes("olympia")) return "Olympia";
        if (target.includes("tumwater")) return "Tumwater";
        if (target.includes("yelm")) return "Yelm";
        if (target.includes("dupont")) return "DuPont";
        if (target.includes("rochester")) return "Rochester";
        if (target.includes("chehalis") || target.includes("centralia")) return "Centralia";
        
        if (locationStr && locationStr.includes(",")) {
            return locationStr.split(",")[0].trim();
        }
        return "Booked";
    }

    function updateTimeAvailability(selectedDates) {
        const statusSpan = document.getElementById('calStatus');
        const checkboxes = document.querySelectorAll('input[name="time"]');

        if (!selectedDates || selectedDates.length === 0) {
            checkboxes.forEach(cb => {
                cb.disabled = false;
                cb.parentElement.classList.remove('slot-busy');
                const badge = cb.parentElement.querySelector('.slot-town-badge');
                if (badge) badge.remove();
            });
            statusSpan.innerText = "(Select date to filter availability)";
            hideTravelAlert();
            return;
        }

        statusSpan.innerText = "(Strikethrough = busy on calendar)";

        const BUFFER_MINUTES = 30;
        const SLOT_DURATION_MINUTES = 30;

        checkboxes.forEach(cb => {
            const slotMinutes = timeStrToMinutes(cb.value);
            let conflictingEvent = null;

            for (const dateObj of selectedDates) {
                const year = dateObj.getFullYear();
                const month = dateObj.getMonth();
                const day = dateObj.getDate();

                const slotStart = new Date(year, month, day, Math.floor(slotMinutes / 60), slotMinutes % 60, 0);
                const slotEnd = new Date(slotStart.getTime() + SLOT_DURATION_MINUTES * 60000);

                conflictingEvent = busySlots.find(busy => {
                    const bufferedStart = new Date(new Date(busy.start).getTime() - BUFFER_MINUTES * 60000);
                    const bufferedEnd = new Date(new Date(busy.end).getTime() + BUFFER_MINUTES * 60000);
                    return slotStart < bufferedEnd && slotEnd > bufferedStart;
                });

                if (conflictingEvent) break;
            }

            const existingBadge = cb.parentElement.querySelector('.slot-town-badge');
            if (existingBadge) existingBadge.remove();

            if (conflictingEvent) {
                cb.checked = false;
                cb.disabled = true;
                cb.parentElement.classList.add('slot-busy');
                
                const town = extractTownName(conflictingEvent.location, conflictingEvent.summary);
                const badge = document.createElement('span');
                badge.className = 'slot-town-badge';
                badge.innerText = ` (${town})`;
                cb.parentElement.appendChild(badge);
            } else {
                cb.disabled = false;
                cb.parentElement.classList.remove('slot-busy');
            }
        });
    }

    // Google Distance Matrix Drive Verification
    async function evaluateDriveBuffer() {
        const currentAddr = document.getElementById('address').value.trim();
        const checkedBox = document.querySelector('input[name="time"]:checked');
        if (!currentAddr || !checkedBox || !picker.selectedDates || picker.selectedDates.length === 0) {
            hideTravelAlert();
            return;
        }

        const dateObj = picker.selectedDates[0];
        const minutes = timeStrToMinutes(checkedBox.value);
        const slotStartDate = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate(), Math.floor(minutes / 60), minutes % 60, 0);

        const dayEvents = busySlots.filter(ev => {
            const evStart = new Date(ev.start);
            return evStart.getFullYear() === slotStartDate.getFullYear() &&
                   evStart.getMonth() === slotStartDate.getMonth() &&
                   evStart.getDate() === slotStartDate.getDate();
        });

        let prevEvent = null;
        dayEvents.forEach(ev => {
            const evEnd = new Date(ev.end);
            if (evEnd <= slotStartDate) {
                if (!prevEvent || new Date(ev.end) > new Date(prevEvent.end)) {
                    prevEvent = ev;
                }
            }
        });

        if (!prevEvent || !prevEvent.location || prevEvent.location === "Scheduled Measure") {
            hideTravelAlert();
            return;
        }

        try {
            const origin = encodeURIComponent(`${prevEvent.location}, WA`);
            const destination = encodeURIComponent(`${currentAddr}, WA`);
            const matrixUrl = `https://maps.googleapis.com/maps/api/distancematrix/json?origins=${origin}&destinations=${destination}&key=${GOOGLE_API_KEY}`;

            const res = await fetch(matrixUrl);
            const data = await res.json();

            if (data.status === "OK" && data.rows[0].elements[0].status === "OK") {
                const durationSec = data.rows[0].elements[0].duration.value;
                const durationText = data.rows[0].elements[0].duration.text;
                const prevTown = extractTownName(prevEvent.location, prevEvent.summary);

                if (durationSec > 1800) {
                    showTravelAlert(
                        `⚠️ <b>Travel Warning:</b> ~<b>${durationText}</b> drive from previous measure in <b>${prevTown}</b>. Consider booking a later time.`
                    );
                } else {
                    showTravelAlert(
                        `🚗 <b>Buffer OK:</b> ~${durationText} drive from previous measure in ${prevTown}.`
                    );
                }
            }
        } catch (e) {
            console.warn("Could not calculate drive matrix", e);
        }
    }

    function showTravelAlert(html) {
        const alertBox = document.getElementById('travelAlert');
        alertBox.innerHTML = html;
        alertBox.style.display = 'block';
    }

    function hideTravelAlert() {
        const alertBox = document.getElementById('travelAlert');
        alertBox.style.display = 'none';
        alertBox.innerHTML = '';
    }

    window.onAddressChanged = function() {
        evaluateDriveBuffer();
    };

    document.querySelectorAll('input[name="time"]').forEach(cb => {
        cb.addEventListener('change', () => {
            evaluateDriveBuffer();
        });
    });

    const picker = flatpickr("#datePicker", {
        mode: "multiple",
        dateFormat: "Y-m-d",
        minDate: "today",
        altInput: true,
        altFormat: "F j, Y",
        conjunction: ", ",
        onChange: function(selectedDates) {
            updateTimeAvailability(selectedDates);
            evaluateDriveBuffer();
        }
    });

    async function initCalendarSync() {
        try {
            const res = await fetch(`${CALENDAR_ENDPOINT}?t=${Date.now()}`);
            if (res.ok) {
                const data = await res.json();
                busySlots = data.busySlots || [];
                if (picker.selectedDates.length > 0) {
                    updateTimeAvailability(picker.selectedDates);
                }
            }
        } catch (e) {
            console.warn("Could not load Outlook availability, all slots remain open.", e);
        }
    }
    initCalendarSync();

    const form = document.getElementById('measureFor
