<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Route Map | B&R Flooring</title>
    
    <!-- Leaflet CSS & JS for Free Mapping -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-dark: #1e293b;
            --card-bg: #334155;
            --text-main: #f8fafc;
        }
        body { margin: 0; padding: 0; font-family: -apple-system, sans-serif; background: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; }
        
        .header { padding: 15px; text-align: center; background: var(--card-bg); box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 1000; position: relative; }
        .header h2 { margin: 0 0 5px 0; font-size: 1.5rem; }
        .legend { display: flex; justify-content: center; gap: 15px; font-size: 0.9rem; }
        .legend span { display: flex; align-items: center; gap: 5px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .dot.historical { background: #3b82f6; }
        .dot.live { background: #10b981; }
        
        .back-btn { position: absolute; left: 15px; top: 18px; color: #3b82f6; text-decoration: none; font-weight: bold; }

        /* The Map Container */
        #map { flex-grow: 1; width: 100%; z-index: 1; }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-btn">&#8592; Back</a>
        <h2>🗺️ Territory Map</h2>
        <div class="legend">
            <span><div class="dot historical"></div> Past Jobs</span>
            <span><div class="dot live"></div> Upcoming Route</span>
        </div>
    </div>

    <div id="map"></div>

    <script>
        // Initialize Map centered on Lacey, WA
        const map = L.map('map').setView([47.0346, -122.8232], 10);

        // Load free OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Custom Pin Icons
        const historicalIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        const liveIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        // Simple Geocoder to turn addresses into coordinates (Free Nominatim API)
        async function geocodeAddress(address) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}`);
                const data = await response.json();
                if (data.length > 0) return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
                return null;
            } catch (e) { return null; }
        }

        async function loadHistoricalData() {
            try {
                const response = await fetch('history.json');
                if (!response.ok) return; // Silent fail if file doesn't exist yet
                
                const history = await response.json();
                for (const job of history) {
                    const coords = await geocodeAddress(job.address);
                    if (coords) {
                        L.marker(coords, {icon: historicalIcon})
                         .addTo(map)
                         .bindPopup(`<b>${job.client}</b><br>${job.date}`);
                    }
                    // Small delay to respect the free geocoder's rate limits
                    await new Promise(r => setTimeout(r, 1000));
                }
            } catch (error) { console.log("No historical data found."); }
        }

        async function loadLiveRoute() {
            try {
                const API_URL = "https://us-central1-chickenmeasurer-37304.cloudfunctions.net/getBusySlots";
                const response = await fetch(API_URL);
                const data = await response.json();
                
                if (data.busySlots) {
                    for (const event of data.busySlots) {
                        const coords = await geocodeAddress(event.location);
                        if (coords) {
                            const cleanTitle = event.summary.replace("Measure: ", "");
                            const dateStr = new Date(event.start).toLocaleDateString();
                            
                            L.marker(coords, {icon: liveIcon})
                             .addTo(map)
                             .bindPopup(`<b>${cleanTitle} (Upcoming)</b><br>${dateStr}<br>${event.location}`);
                        }
                        await new Promise(r => setTimeout(r, 1000));
                    }
                }
            } catch (error) { console.log("Could not load live route."); }
        }

        // Run the loads
        loadHistoricalData();
        loadLiveRoute();
    </script>
</body>
</html>
