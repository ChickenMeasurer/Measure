<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Route Map | B&R Flooring</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-dark: #1e293b;
            --card-bg: #334155;
            --text-main: #f8fafc;
        }
        body { margin: 0; padding: 0; font-family: -apple-system, sans-serif; background: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; }
        
        .header { padding: 15px; text-align: center; background: var(--card-bg); box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 1000; position: relative; }
        .header h2 { margin: 0 0 5px 0; font-size: 1.5rem; }
        .legend { display: flex; justify-content: center; gap: 15px; font-size: 0.9rem; margin-bottom: 10px; }
        .legend span { display: flex; align-items: center; gap: 5px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .dot.historical { background: #3b82f6; }
        .dot.live { background: #10b981; }
        
        #status-bar { background: #10b981; color: white; font-size: 0.85rem; padding: 6px; font-weight: bold; border-radius: 6px; }
        
        .back-btn { position: absolute; left: 15px; top: 18px; color: #3b82f6; text-decoration: none; font-weight: bold; }
        #map { flex-grow: 1; width: 100%; z-index: 1; }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-btn">&#8592; Back</a>
        <h2>🗺️ Territory Map</h2>
        <div class="legend">
            <span><div class="dot historical"></div> Past Jobs</span>
            <span><div class="dot live"></div> Upcoming Route</span>
        </div>
        <div id="status-bar">Loading Map...</div>
    </div>

    <div id="map"></div>

    <script>
        const map = L.map('map').setView([47.0346, -122.8232], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const historicalIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        const liveIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        function setStatus(message, color = "#10b981") {
            const bar = document.getElementById('status-bar');
            bar.innerText = message;
            bar.style.background = color;
        }

        async function geocodeAddress(address) {
            try {
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&email=chickenmeasurer@outlook.com`;
                const response = await fetch(url);
                const data = await response.json();
                if (data && data.length > 0) return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
                return null;
            } catch (e) { return null; }
        }

        async function loadData() {
            // 1. Check if we have cached coordinates saved in browser memory already!
            let cachedPins = localStorage.getItem('br_historical_pins');
            
            if (cachedPins) {
                setStatus("Loading cached history (Instant)...", "#3b82f6");
                const pins = JSON.parse(cachedPins);
                pins.forEach(pin => {
                    L.marker([pin.lat, pin.lon], {icon: historicalIcon}).addTo(map).bindPopup(`<b>${pin.client}</b><br>${pin.date}`);
                });
            } else {
                // If no cache exists yet, build it once
                setStatus("Building history cache (First time only)...", "#f59e0b");
                try {
                    const response = await fetch('history.json');
                    const history = await response.json();
                    let pinArray = [];

                    for (const job of history) {
                        setStatus(`Caching: ${job.client}...`, "#f59e0b");
                        const coords = await geocodeAddress(job.address);
                        if (coords) {
                            pinArray.push({ client: job.client, date: job.date, lat: coords[0], lon: coords[1] });
                            L.marker(coords, {icon: historicalIcon}).addTo(map).bindPopup(`<b>${job.client}</b><br>${job.date}`);
                        }
                        await new Promise(r => setTimeout(r, 1100)); // Rate limit safety
                    }
                    // Save to local browser storage forever
                    localStorage.setItem('br_historical_pins', JSON.stringify(pinArray));
                } catch (e) {
                    console.log("Error caching history");
                }
            }

            // 2. Load Live Route (Always fetched fresh so new bookings show up)
            try {
                setStatus("Syncing live route...", "#10b981");
                const API_URL = "https://us-central1-chickenmeasurer-37304.cloudfunctions.net/getBusySlots";
                const response = await fetch(API_URL);
                const data = await response.json();
                
                if (data.busySlots) {
                    for (const event of data.busySlots) {
                        const coords = await geocodeAddress(event.location);
                        if (coords) {
                            const cleanTitle = event.summary.replace("Measure: ", "");
                            L.marker(coords, {icon: liveIcon}).addTo(map).bindPopup(`<b>${cleanTitle} (Upcoming)</b><br>${event.location}`);
                        }
                        await new Promise(r => setTimeout(r, 1100));
                    }
                }
            } catch (error) { console.log("Live route load failed."); }

            setStatus("Map Ready!", "#22c55e");
            setTimeout(() => { document.getElementById('status-bar').style.display = 'none'; }, 3000);
        }

        loadData();
    </script>
</body>
</html>
