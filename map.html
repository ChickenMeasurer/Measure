<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Route Map | B&R Flooring</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-dark: #1e293b;
            --card-bg: #334155;
            --text-main: #f8fafc;
        }
        body { margin: 0; padding: 0; font-family: -apple-system, sans-serif; background: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; }
        
        .header { padding: 15px; text-align: center; background: var(--card-bg); box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 1000; position: relative; }
        .header h2 { margin: 0 0 5px 0; font-size: 1.4rem; }
        .legend { display: flex; justify-content: center; gap: 15px; font-size: 0.85rem; margin-bottom: 8px; flex-wrap: wrap; }
        .legend span { display: flex; align-items: center; gap: 5px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .dot.historical { background: #3b82f6; }
        .dot.live { background: #10b981; }
        .dot.perimeter { background: #a855f7; width: 14px; height: 4px; border-radius: 2px; }
        
        #status-bar { background: #3b82f6; color: white; font-size: 0.8rem; padding: 4px; font-weight: bold; border-radius: 4px; }
        .back-btn { position: absolute; left: 15px; top: 18px; color: #3b82f6; text-decoration: none; font-weight: bold; }
        
        #map { flex-grow: 1; width: 100%; z-index: 1; background: #1e293b; }

        /* CSS Dark Mode Filter for Standard Map Tiles (Watermark-Free) */
        .leaflet-tile-pane { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3); }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-btn">&#8592; Back</a>
        <h2>🗺️ Territory Map</h2>
        <div class="legend">
            <span><div class="dot historical"></div> Past Jobs</span>
            <span><div class="dot live"></div> Upcoming Route</span>
            <span><div class="dot perimeter"></div> Measured Perimeter</span>
        </div>
        <div id="status-bar">Syncing Map Data...</div>
    </div>

    <div id="map"></div>

    <script>
        const map = L.map('map', { zoomControl: false }).setView([47.0346, -122.8232], 10);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Standard OpenStreetMap tiles (Completely free, unwatermarked, firewall-friendly via Firestore cache)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        const historicalIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [20, 33], iconAnchor: [10, 33], popupAnchor: [1, -28], shadowSize: [33, 33]
        });

        const liveIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [20, 33], iconAnchor: [10, 33], popupAnchor: [1, -28], shadowSize: [33, 33]
        });

        function setStatus(message, color = "#3b82f6") {
            const bar = document.getElementById('status-bar');
            if (bar) {
                bar.innerText = message;
                bar.style.background = color;
            }
        }

        function computeConvexHull(points) {
            points.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
            const cross = (o, a, b) => (a[1] - o[1]) * (b[0] - o[0]) - (a[0] - o[0]) * (b[1] - o[1]);
            const lower = [];
            for (let p of points) {
                while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop();
                lower.push(p);
            }
            const upper = [];
            for (let i = points.length - 1; i >= 0; i--) {
                const p = points[i];
                while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop();
                upper.push(p);
            }
            upper.pop();
            lower.pop();
            return lower.concat(upper);
        }

        async function loadMapData() {
            let latLonPoints = [];

            try {
                setStatus("Loading territory history...", "#3b82f6");
                const historyRes = await fetch(`https://us-central1-chickenmeasurer-37304.cloudfunctions.net/getHistory?nocache=${Date.now()}`);
                const historyData = await historyRes.json();

                if (historyData.success && historyData.history) {
                    historyData.history.forEach(job => {
                        if (job.lat && job.lon) {
                            latLonPoints.push([job.lat, job.lon]);
                            L.marker([job.lat, job.lon], {icon: historicalIcon})
                             .addTo(map)
                             .bindPopup(`<b>${job.client}</b><br>${job.date}<br><small>${job.address}</small>`);
                        }
                    });
                }
            } catch (e) {
                console.error("Failed to load history", e);
            }

            if (latLonPoints.length > 2) {
                const hull = computeConvexHull(latLonPoints);
                L.polygon(hull, {
                    color: '#a855f7',
                    weight: 3,
                    opacity: 0.8,
                    fillColor: '#a855f7',
                    fillOpacity: 0.12,
                    dashArray: '6, 6'
                }).addTo(map);
            }

            setStatus("Territory Loaded!", "#10b981");
            setTimeout(() => { 
                const bar = document.getElementById('status-bar');
                if (bar) bar.style.display = 'none'; 
            }, 2500);
        }

        loadMapData();
    </script>
</body>
</html>
