<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Route Map | B&R Flooring</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-dark: #1e293b;
            --card-bg: #334155;
            --text-main: #f8fafc;
        }
        body { margin: 0; padding: 0; font-family: -apple-system, sans-serif; background: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; }
        
        .header { padding: 15px; text-align: center; background: var(--card-bg); box-shadow: 0 4px 6px rgba(0,0,0,0.3); z-index: 1000; position: relative; }
        .header h2 { margin: 0 0 5px 0; font-size: 1.5rem; }
        .legend { display: flex; justify-content: center; gap: 15px; font-size: 0.9rem; margin-bottom: 10px; }
        .legend span { display: flex; align-items: center; gap: 5px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
        .dot.historical { background: #3b82f6; }
        .dot.live { background: #10b981; }
        
        #status-bar { background: #10b981; color: white; font-size: 0.85rem; padding: 6px; font-weight: bold; border-radius: 6px; }
        .back-btn { position: absolute; left: 15px; top: 18px; color: #3b82f6; text-decoration: none; font-weight: bold; }
        #map { flex-grow: 1; width: 100%; z-index: 1; }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-btn">&#8592; Back</a>
        <h2>🗺️ Territory Map</h2>
        <div class="legend">
            <span><div class="dot historical"></div> Past Jobs</span>
            <span><div class="dot live"></div> Upcoming Route</span>
        </div>
        <div id="status-bar">Loading Map Data...</div>
    </div>

    <div id="map"></div>

    <script>
        const map = L.map('map').setView([47.0346, -122.8232], 10);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        const historicalIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        const liveIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        function setStatus(message, color = "#10b981") {
            const bar = document.getElementById('status-bar');
            if (bar) {
                bar.innerText = message;
                bar.style.background = color;
            }
        }

        async function loadMapData() {
            // 1. Fetch Past Jobs directly from your Firestore database via Cloud Function
            try {
                setStatus("Loading historical pins...", "#3b82f6");
                const historyRes = await fetch("https://us-central1-chickenmeasurer-37304.cloudfunctions.net/getHistory");
                const historyData = await historyRes.json();

                if (historyData.success && historyData.history) {
                    historyData.history.forEach(job => {
                        if (job.lat && job.lon) {
                            L.marker([job.lat, job.lon], {icon: historicalIcon})
                             .addTo(map)
                             .bindPopup(`<b>${job.client}</b><br>${job.date}`);
                        }
                    });
                }
            } catch (e) {
                console.error("Failed to load history from Firestore", e);
            }

            // 2. Fetch Live Route from Firebase
            try {
                setStatus("Loading upcoming route...", "#10b981");
                const routeRes = await fetch("https://us-central1-chickenmeasurer-37304.cloudfunctions.net/getBusySlots");
                const routeData = await routeRes.json();

                if (routeData.busySlots) {
                    for (const event of routeData.busySlots) {
                        // For live events, we use a server-side helper or basic lookup, 
                        // but if work firewall blocks nominatim, we can also store upcoming appointments in Firestore when booked!
                        const cleanTitle = event.summary.replace("Measure: ", "");
                        // (If needed, we can also geocode live routes server-side when booked so the browser never touches Nominatim)
                    }
                }
            } catch (e) {
                console.error("Failed to load live route", e);
            }

            setStatus("Map Ready!", "#22c55e");
            setTimeout(() => { 
                const bar = document.getElementById('status-bar');
                if (bar) bar.style.display = 'none'; 
            }, 2000);
        }

        loadMapData();
    </script>
</body>
</html>
