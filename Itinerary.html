<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Itinerary | B&R Flooring</title>
    <style>
        :root {
            --bg-dark: #1e293b;
            --card-bg: #334155;
            --accent: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            padding-bottom: 40px;
        }
        h2 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 15px;
        }
        
        /* New Date Navigation Bar */
        .date-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 10px 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .nav-arrow {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .nav-arrow:active {
            background-color: #2563eb;
        }
        .date-display {
            text-align: center;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
        }
        .date-sub {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: normal;
            margin-top: 2px;
        }

        .loading {
            text-align: center;
            color: var(--accent);
            font-weight: bold;
            margin-top: 40px;
        }
        .job-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.3s ease-out;
        }
        .time-block {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 5px;
        }
        .job-title {
            font-size: 1.15rem;
            margin-bottom: 8px;
        }
        .job-address {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .nav-btn {
            display: block;
            width: 100%;
            background-color: #22c55e;
            color: white;
            text-align: center;
            padding: 15px 0;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .nav-btn:active {
            background-color: #16a34a;
        }
        .empty-state {
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
            font-size: 1.1rem;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <h2>🚗 Route Planner</h2>
    
    <!-- Date Navigation UI -->
    <div class="date-navigation">
        <button class="nav-arrow" onclick="changeDay(-1)">&#8592;</button>
        <div class="date-display" id="currentDateDisplay">
            Loading...
            <span class="date-sub">Syncing Calendar</span>
        </div>
        <button class="nav-arrow" onclick="changeDay(1)">&#8594;</button>
    </div>

    <div id="itineraryList">
        <div class="loading">Syncing with Exchange...</div>
    </div>

    <script>
        const API_URL = "https://us-central1-chickenmeasurer-37304.cloudfunctions.net/getBusySlots";
        
        let allEvents = []; // This caches the data so flipping days is instant
        let viewDate = new Date(); // The date currently being viewed

        async function fetchRouteData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                if (data.busySlots && data.busySlots.length > 0) {
                    allEvents = data.busySlots;
                }
                
                // Once data is loaded, update the UI
                updateView();

            } catch (error) {
                console.error("Error fetching route:", error);
                showEmpty("Failed to load route. Check connection.");
                document.getElementById('currentDateDisplay').innerHTML = `Error<span class="date-sub">Offline Mode</span>`;
            }
        }

        function changeDay(offset) {
            viewDate.setDate(viewDate.getDate() + offset);
            updateView();
        }

        function updateView() {
            // 1. Update the Date Header
            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            const formattedDate = viewDate.toLocaleDateString('en-US', options);
            
            // Add a helpful sub-label if it's Today, Tomorrow, or Yesterday
            const today = new Date();
            let relativeLabel = "";
            
            const msDiff = viewDate.getTime() - today.getTime();
            const daysDiff = Math.round(msDiff / (1000 * 60 * 60 * 24));

            if (daysDiff === 0) relativeLabel = "Today";
            else if (daysDiff === 1) relativeLabel = "Tomorrow";
            else if (daysDiff === -1) relativeLabel = "Yesterday";
            else relativeLabel = "Scheduled Route";

            document.getElementById('currentDateDisplay').innerHTML = `${relativeLabel}<span class="date-sub">${formattedDate}</span>`;

            // 2. Filter events for the selected day
            const dayEvents = allEvents.filter(slot => {
                const eventDate = new Date(slot.start);
                return eventDate.getDate() === viewDate.getDate() &&
                       eventDate.getMonth() === viewDate.getMonth() &&
                       eventDate.getFullYear() === viewDate.getFullYear();
            });

            // 3. Sort chronologically and render
            dayEvents.sort((a, b) => new Date(a.start) - new Date(b.start));
            renderCards(dayEvents);
        }

        function renderCards(events) {
            const listDiv = document.getElementById('itineraryList');
            listDiv.innerHTML = ""; // Clear loading text/previous cards

            if (events.length === 0) {
                showEmpty("Your schedule is clear for this day!");
                return;
            }

            events.forEach(event => {
                const startDate = new Date(event.start);
                const timeString = startDate.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
                const cleanTitle = event.summary.replace("Measure: ", "");
                const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(event.location)}`;

                const cardHTML = `
                    <div class="job-card">
                        <div class="time-block">${timeString}</div>
                        <div class="job-title">${cleanTitle}</div>
                        <div class="job-address">📍 ${event.location}</div>
                        <a href="${mapsUrl}" target="_blank" class="nav-btn">🧭 Start Navigation</a>
                    </div>
                `;
                listDiv.innerHTML += cardHTML;
            });
        }

        function showEmpty(message) {
            document.getElementById('itineraryList').innerHTML = `<div class="empty-state">${message}</div>`;
        }

        // Initialize the app on load
        fetchRouteData();
    </script>
</body>
</html>
