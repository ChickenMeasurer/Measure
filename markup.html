<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FloorMark Pro - Flooring PDF Markup Tool</title>
    <!-- PDF.js Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>if (typeof pdfjsLib === 'undefined') document.write('<script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"><\/script>');</script>

    <!-- Fabric.js Vector Canvas Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script>if (typeof fabric === 'undefined') document.write('<script src="https://unpkg.com/fabric@5.3.0/dist/fabric.min.js"><\/script>');</script>

    <!-- jsPDF Engine for True-Scale PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>if (typeof window.jspdf === 'undefined') document.write('<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"><\/script>');</script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100vh; display: flex; flex-direction: column; background-color: #1e293b; color: #1f2937; overflow: hidden; }

        /* Header Navigation Bar */
        header { background-color: #0f172a; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; z-index: 20; }
        .header-title-group { display: flex; align-items: center; gap: 14px; }
        header h1 { font-size: 1.2rem; font-weight: 600; color: #f8fafc; }
        .scale-badge { font-size: 0.8rem; background-color: #334155; color: #38bdf8; padding: 3px 8px; border-radius: 4px; font-weight: 600; }
        .header-instruction { background-color: #1e293b; color: #e2e8f0; padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; border: 1px solid #475569; max-width: 500px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }

        /* Main Workspace Layout */
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 320px; background-color: #ffffff; border-right: 1px solid #cbd5e1; padding: 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
        .section-title { font-size: 0.72rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }

        /* Sidebar Buttons */
        .btn { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 8px 11px; background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.84rem; font-weight: 500; color: #334155; cursor: pointer; transition: all 0.15s ease; }
        .btn:hover { background-color: #f1f5f9; border-color: #94a3b8; }
        .btn.active { background-color: #eff6ff; border-color: #2563eb; color: #1d4ed8; font-weight: 600; box-shadow: 0 0 0 1px #2563eb; }
        .btn-upload { background-color: #059669; color: white; border: none; justify-content: center; font-weight: 600; }
        .btn-upload:hover { background-color: #047857; }
        .btn-export-pdf { background-color: #2563eb; color: white; border: none; justify-content: center; font-weight: 600; }
        .btn-export-pdf:hover { background-color: #1d4ed8; }
        .btn-clear { background-color: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; justify-content: center; }
        .btn-clear:hover { background-color: #fecaca; }
        .kbd-badge { background-color: #e2e8f0; color: #475569; font-size: 0.68rem; padding: 2px 5px; border-radius: 4px; font-family: monospace; border: 1px solid #cbd5e1; }
        .btn.active .kbd-badge { background-color: #bfdbfe; color: #1e40af; border-color: #93c5fd; }

        /* Opacity Controls */
        .slider-container { display: flex; flex-direction: column; gap: 4px; margin-top: 2px; }
        .slider-label { display: flex; justify-content: space-between; font-size: 0.78rem; font-weight: 600; color: #475569; }
        input[type=range] { width: 100%; cursor: pointer; }

        /* Zoom Button Row */
        .zoom-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

        /* Canvas Viewport */
        .viewport { 
            flex: 1; 
            background-color: #334155; 
            overflow: auto; 
            position: relative; 
            padding: 40px; 
            display: flex; 
        }
        .canvas-container-wrapper { 
            position: relative; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); 
            background-color: white; 
            margin: auto; /* Centered when small; scrollable when zoomed */
        }
        #fabric-canvas { position: absolute; top: 0; left: 0; }
        #file-input { display: none; }
    </style>
</head>
<body>

    <header>
        <div class="header-title-group">
            <h1>FloorMark Pro</h1>
            <span class="scale-badge">Scale: 1/4" = 1' (18px = 1ft)</span>
        </div>
        <div class="header-instruction" id="instruction-bar">
            Upload a PDF drawing to begin marking up.
        </div>
    </header>

    <div class="main-container">
        <div class="sidebar">
            <button class="btn btn-upload" onclick="document.getElementById('file-input').click()">
                📄 Upload PDF Floorplan
            </button>
            <input type="file" id="file-input" accept="application/pdf">

            <div>
                <div class="section-title">Standard Tools</div>
                <div style="display: flex; flex-direction: column; gap: 6px;">
                    <button class="btn active" id="tool-select" onclick="setTool('select')">
                        <span>👆 Select / Move</span>
                        <span class="kbd-badge">Esc</span>
                    </button>
                    <button class="btn" id="tool-pen" onclick="setTool('pen')">
                        <span>✏️ Pen Tool</span>
                    </button>
                    <button class="btn" id="tool-text" onclick="setTool('text')">
                        <span>🔤 Add Text</span>
                    </button>
                </div>
            </div>

            <div>
                <div class="section-title">Measurement Tools</div>
                <div style="display: flex; flex-direction: column; gap: 6px;">
                    <button class="btn" id="tool-sqft" onclick="setTool('sqft')">
                        <span>📦 SqFt Box (Backslash Hatch)</span>
                    </button>
                    <button class="btn" id="tool-poly" onclick="setTool('poly')">
                        <span>📐 Custom Area (L-Shape)</span>
                        <span class="kbd-badge">A</span>
                    </button>
                    <button class="btn" id="tool-carpet" onclick="setTool('carpet')">
                        <span>✂️ Carpet Cut (Forward Hatch)</span>
                        <span class="kbd-badge">C</span>
                    </button>
                    <button class="btn" id="tool-carpet-lock" onclick="toggleCarpetLock()">
                        <span id="carpet-lock-label">🔒 Lock: 12' Width</span>
                        <span class="kbd-badge">W</span>
                    </button>
                    <button class="btn" id="btn-finish-poly" style="display:none; background-color:#10b981; color:white; font-weight:600;" onclick="finishPolyDrawing()">
                        <span>✅ Finish Shape</span>
                        <span class="kbd-badge" style="background:#047857; color:white; border:none;">Enter</span>
                    </button>
                </div>
            </div>

            <div>
                <div class="section-title">Hatch Line Opacity</div>
                <div class="slider-container">
                    <div class="slider-label">
                        <span>Transparency:</span>
                        <span id="opacity-val">35%</span>
                    </div>
                    <input type="range" id="opacity-slider" min="10" max="100" value="35" oninput="updateHatchOpacity(this.value)">
                </div>
            </div>

            <div>
                <div class="section-title">Viewport Zoom</div>
                <div class="zoom-row">
                    <button class="btn" onclick="adjustZoom(0.15)" style="justify-content:center;">🔍 +15%</button>
                    <button class="btn" onclick="adjustZoom(-0.15)" style="justify-content:center;">🔍 -15%</button>
                    <button class="btn" onclick="resetZoom()" style="justify-content:center;">1:1 Reset</button>
                </div>
            </div>

            <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px;">
                <div class="section-title">Actions & Exports</div>
                <button class="btn" onclick="undoLastAction()">
                    <span>↩️ Undo Last Action</span>
                    <span class="kbd-badge">Ctrl+Z</span>
                </button>
                <button class="btn btn-export-pdf" onclick="exportScaledPDF()">
                    🖨️ Export Scaled PDF (1/4" Scale)
                </button>
                <button class="btn btn-clear" onclick="clearDrawings()">
                    🗑️ Clear All Markups
                </button>
            </div>
        </div>

        <div class="viewport" id="viewport">
            <div class="canvas-container-wrapper" id="canvas-wrapper">
                <canvas id="fabric-canvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        const SCALE_FACTOR = 18; // 18 pixels = 1 foot (at 72 DPI PDF standard)
        let pdfDoc = null;
        let fabricCanvas = null;
        let pdfBgImage = null;
        let currentTool = 'select';
        let carpetLockMode = 'width';
        let hatchOpacity = 0.35;
        let currentZoom = 1.0;

        let originalPageWidthPt = 612;
        let originalPageHeightPt = 792;
        let renderWidthPx = 918;
        let renderHeightPx = 1188;

        // Poly state
        let isDrawingPoly = false;
        let polyPoints = [];
        let activePolyLine = null;
        let polyGuideLines = [];

        // Box state
        let isDrawingBox = false;
        let origX = 0, origY = 0;
        let activeShape = null;

        // Undo Stack
        let actionHistory = [];

        window.addEventListener('load', () => {
            initFabric();
            setupKeyboardShortcuts();
        });

        function initFabric() {
            if (typeof fabric === 'undefined') {
                updateInstruction("Error: Drawing engine blocked by network firewall.");
                return;
            }

            fabricCanvas = new fabric.Canvas('fabric-canvas', {
                selection: true,
                preserveObjectStacking: true
            });

            fabricCanvas.on('mouse:down', onMouseDown);
            fabricCanvas.on('mouse:move', onMouseMove);
            fabricCanvas.on('mouse:dblclick', onMouseDblClick);
            fabricCanvas.on('mouse:up', onMouseUp);
            fabricCanvas.on('object:scaling', onObjectScaling);
            fabricCanvas.on('object:modified', onObjectModified);

            document.getElementById('file-input').addEventListener('change', handleFileUpload);
        }

        function createHatchPattern(baseColor, angle, opacity) {
            const patternCanvas = document.createElement('canvas');
            patternCanvas.width = 16;
            patternCanvas.height = 16;
            const pctx = patternCanvas.getContext('2d');

            pctx.strokeStyle = baseColor;
            pctx.globalAlpha = opacity;
            pctx.lineWidth = 1.8;
            pctx.beginPath();

            if (angle === 45) {
                pctx.moveTo(0, 16); pctx.lineTo(16, 0);
                pctx.moveTo(-4, 4); pctx.lineTo(4, -4);
                pctx.moveTo(12, 20); pctx.lineTo(20, 12);
            } else {
                pctx.moveTo(0, 0); pctx.lineTo(16, 16);
                pctx.moveTo(-4, 12); pctx.lineTo(4, 20);
                pctx.moveTo(12, -4); pctx.lineTo(20, 4);
            }
            pctx.stroke();

            return new fabric.Pattern({
                source: patternCanvas,
                repeat: 'repeat'
            });
        }

        function updateHatchOpacity(val) {
            hatchOpacity = val / 100;
            document.getElementById('opacity-val').innerText = `${val}%`;

            if (!fabricCanvas) return;

            fabricCanvas.getObjects().forEach(obj => {
                if (obj.isType('group')) {
                    const shape = obj.item(0);
                    if (shape) {
                        const isCarpet = (obj.toolType === 'carpet');
                        const baseColor = isCarpet ? '#d97706' : '#2563eb';
                        const angle = isCarpet ? 45 : 135;
                        shape.set('fill', createHatchPattern(baseColor, angle, hatchOpacity));
                    }
                } else if (obj.isType('polygon')) {
                    obj.set('fill', createHatchPattern('#2563eb', 135, hatchOpacity));
                }
            });

            fabricCanvas.renderAll();
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file || file.type !== 'application/pdf') return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const typedarray = new Uint8Array(evt.target.result);
                pdfjsLib.getDocument(typedarray).promise.then(pdf => {
                    pdfDoc = pdf;
                    renderPage(1);
                });
            };
            reader.readAsArrayBuffer(file);
        }

        function renderPage(pageNum) {
            pdfDoc.getPage(pageNum).then(page => {
                const unscaledViewport = page.getViewport({ scale: 1.0 });
                originalPageWidthPt = unscaledViewport.width;
                originalPageHeightPt = unscaledViewport.height;

                const viewport = page.getViewport({ scale: 1.5 });
                renderWidthPx = viewport.width;
                renderHeightPx = viewport.height;

                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = renderWidthPx;
                tempCanvas.height = renderHeightPx;
                const tempCtx = tempCanvas.getContext('2d');

                page.render({ canvasContext: tempCtx, viewport: viewport }).promise.then(() => {
                    const imgDataUrl = tempCanvas.toDataURL('image/png');
                    fabric.Image.fromURL(imgDataUrl, (img) => {
                        pdfBgImage = img;
                        img.set({ selectable: false, evented: false });

                        const wrapper = document.getElementById('canvas-wrapper');
                        wrapper.style.width = renderWidthPx + 'px';
                        wrapper.style.height = renderHeightPx + 'px';

                        fabricCanvas.setWidth(renderWidthPx);
                        fabricCanvas.setHeight(renderHeightPx);
                        fabricCanvas.setBackgroundImage(img, fabricCanvas.renderAll.bind(fabricCanvas));

                        updateInstruction('PDF Loaded at 1/4" scale. Select a tool to mark up.');
                    });
                });
            });
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.sidebar .btn').forEach(b => {
                if (b.id && b.id.startsWith('tool-') && b.id !== 'tool-carpet-lock') {
                    b.classList.remove('active');
                }
            });

            const activeBtn = document.getElementById(`tool-${tool}`);
            if (activeBtn) activeBtn.classList.add('active');

            resetPolyDrawing();

            if (!fabricCanvas) return;
            fabricCanvas.isDrawingMode = (tool === 'pen');
            fabricCanvas.selection = (tool === 'select');

            if (tool === 'pen') {
                fabricCanvas.freeDrawingBrush.color = '#dc2626';
                fabricCanvas.freeDrawingBrush.width = 3;
                updateInstruction('Pen Mode: Draw freehand lines.');
            } else if (tool === 'select') {
                updateInstruction('Select Mode: Move or resize markups. Use arrow keys to nudge (Shift = fast).');
            } else if (tool === 'sqft') {
                updateInstruction('SqFt Box: Drag rectangular area (Blue Backslash Hatch).');
            } else if (tool === 'poly') {
                updateInstruction('Custom L-Shape: Click corners sequentially. Press Enter to finish.');
            } else if (tool === 'carpet') {
                updateInstruction(`Carpet Cut: Drag cut area (Amber Forward Hatch, 12' ${carpetLockMode}).`);
            } else if (tool === 'text') {
                updateInstruction('Text Tool: Click canvas to insert text notes.');
            }
        }

        function toggleCarpetLock() {
            carpetLockMode = (carpetLockMode === 'width') ? 'height' : 'width';
            document.getElementById('carpet-lock-label').innerText = `🔒 Lock: 12' ${carpetLockMode.charAt(0).toUpperCase() + carpetLockMode.slice(1)}`;
            if (currentTool === 'carpet') {
                updateInstruction(`Carpet Cut: Drag cut area (Amber Forward Hatch, 12' ${carpetLockMode}).`);
            }
        }

        function adjustZoom(delta) {
            currentZoom = Math.min(Math.max(0.5, currentZoom + delta), 2.5);
            applyZoom();
        }

        function resetZoom() {
            currentZoom = 1.0;
            applyZoom();
        }

        function applyZoom() {
            if (!fabricCanvas) return;
            fabricCanvas.setZoom(currentZoom);
            fabricCanvas.setWidth(renderWidthPx * currentZoom);
            fabricCanvas.setHeight(renderHeightPx * currentZoom);
            const wrapper = document.getElementById('canvas-wrapper');
            wrapper.style.width = (renderWidthPx * currentZoom) + 'px';
            wrapper.style.height = (renderHeightPx * currentZoom) + 'px';
        }

        function setupKeyboardShortcuts() {
            window.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                if (fabricCanvas && fabricCanvas.getActiveObject() && fabricCanvas.getActiveObject().type === 'i-text' && fabricCanvas.getActiveObject().isEditing) return;

                // Arrow key pixel-nudging logic
                if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                    const activeObj = fabricCanvas.getActiveObject();
                    if (activeObj) {
                        e.preventDefault();
                        const step = e.shiftKey ? 10 : 1;
                        if (e.key === 'ArrowUp') activeObj.top -= step;
                        if (e.key === 'ArrowDown') activeObj.top += step;
                        if (e.key === 'ArrowLeft') activeObj.left -= step;
                        if (e.key === 'ArrowRight') activeObj.left += step;
                        activeObj.setCoords();
                        fabricCanvas.renderAll();
                        return;
                    }
                }

                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                    e.preventDefault(); undoLastAction();
                } else if (e.key.toLowerCase() === 'c') {
                    setTool('carpet');
                } else if (e.key.toLowerCase() === 'w') {
                    toggleCarpetLock();
                } else if (e.key.toLowerCase() === 'a') {
                    setTool('poly');
                } else if (e.key === '+' || e.key === '=') {
                    adjustZoom(0.15);
                } else if (e.key === '-' || e.key === '_') {
                    adjustZoom(-0.15);
                } else if (e.key === 'Enter' && isDrawingPoly) {
                    finishPolyDrawing();
                } else if (e.key === 'Escape') {
                    setTool('select');
                } else if (e.key === 'Delete' || e.key === 'Backspace') {
                    deleteSelected();
                }
            });
        }

        function onMouseDown(opt) {
            if (!fabricCanvas) return;
            const pointer = fabricCanvas.getPointer(opt.e);

            if (currentTool === 'text') {
                const text = new fabric.IText('Note', {
                    left: pointer.x,
                    top: pointer.y,
                    fontSize: 16,
                    fill: '#0f172a',
                    backgroundColor: 'rgba(255, 255, 255, 0.9)'
                });
                fabricCanvas.add(text);
                recordAction([text]);
                setTool('select');
                fabricCanvas.setActiveObject(text);
                text.enterEditing();
                return;
            }

            if (currentTool === 'sqft' || currentTool === 'carpet') {
                isDrawingBox = true;
                origX = pointer.x;
                origY = pointer.y;

                const strokeColor = (currentTool === 'sqft') ? '#2563eb' : '#d97706';
                const pattern = (currentTool === 'sqft') ? createHatchPattern('#2563eb', 135, hatchOpacity) : createHatchPattern('#d97706', 45, hatchOpacity);

                activeShape = new fabric.Rect({
                    left: origX,
                    top: origY,
                    width: 0,
                    height: 0,
                    fill: pattern,
                    stroke: strokeColor,
                    strokeWidth: 2,
                    transparentCorners: false
                });

                fabricCanvas.add(activeShape);
            } else if (currentTool === 'poly') {
                document.getElementById('btn-finish-poly').style.display = 'flex';
                if (!isDrawingPoly) {
                    isDrawingPoly = true;
                    polyPoints = [{ x: pointer.x, y: pointer.y }];

                    activePolyLine = new fabric.Line([pointer.x, pointer.y, pointer.x, pointer.y], {
                        stroke: '#2563eb',
                        strokeWidth: 2,
                        strokeDashArray: [4, 4],
                        selectable: false,
                        evented: false
                    });
                    fabricCanvas.add(activePolyLine);
                } else {
                    polyPoints.push({ x: pointer.x, y: pointer.y });
                    const prevPt = polyPoints[polyPoints.length - 2];
                    const guideLine = new fabric.Line([prevPt.x, prevPt.y, pointer.x, pointer.y], {
                        stroke: '#2563eb',
                        strokeWidth: 2,
                        selectable: false,
                        evented: false
                    });
                    polyGuideLines.push(guideLine);
                    fabricCanvas.add(guideLine);
                }
            }
        }

        function onMouseMove(opt) {
            if (!fabricCanvas) return;
            const pointer = fabricCanvas.getPointer(opt.e);

            if (isDrawingBox && activeShape) {
                let w = pointer.x - origX;
                let h = pointer.y - origY;

                if (currentTool === 'carpet') {
                    const fixed12ftPx = 12 * SCALE_FACTOR * 1.5;
                    if (carpetLockMode === 'width') w = (w >= 0) ? fixed12ftPx : -fixed12ftPx;
                    else h = (h >= 0) ? fixed12ftPx : -fixed12ftPx;
                }

                if (w < 0) activeShape.set({ left: pointer.x });
                if (h < 0) activeShape.set({ top: pointer.y });

                activeShape.set({ width: Math.abs(w), height: Math.abs(h) });
                fabricCanvas.renderAll();
            } else if (isDrawingPoly && activePolyLine) {
                const lastPt = polyPoints[polyPoints.length - 1];
                activePolyLine.set({ x1: lastPt.x, y1: lastPt.y, x2: pointer.x, y2: pointer.y });
                fabricCanvas.renderAll();
            }
        }

        function onMouseUp() {
            if (isDrawingBox && activeShape) {
                isDrawingBox = false;

                const actualScale = SCALE_FACTOR * 1.5;
                const widthFt = (activeShape.width / actualScale).toFixed(1);
                const heightFt = (activeShape.height / actualScale).toFixed(1);
                const sqft = (widthFt * heightFt).toFixed(1);

                const labelText = (currentTool === 'sqft') 
                    ? `${sqft} Sq Ft\n(${widthFt}' x ${heightFt}')`
                    : `Carpet Cut\n${sqft} Sq Ft (${widthFt}' x ${heightFt}')`;

                const label = new fabric.Text(labelText, {
                    fontSize: 13,
                    fontWeight: 'bold',
                    fill: (currentTool === 'sqft') ? '#1e3a8a' : '#78350f',
                    backgroundColor: 'rgba(255, 255, 255, 0.85)',
                    textAlign: 'center',
                    originX: 'center',
                    originY: 'center',
                    left: activeShape.left + (activeShape.width / 2),
                    top: activeShape.top + (activeShape.height / 2)
                });

                const group = new fabric.Group([activeShape, label], {
                    selectable: true,
                    toolType: currentTool
                });

                fabricCanvas.remove(activeShape);
                fabricCanvas.add(group);
                recordAction([group]);
                activeShape = null;
            }
        }

        function onObjectScaling(e) {
            const group = e.target;
            if (!group || !group.isType('group')) return;

            const rect = group.item(0);
            const text = group.item(1);
            if (!rect || !text) return;

            const actualScale = SCALE_FACTOR * 1.5;
            const currentWidthPx = rect.width * group.scaleX;
            const currentHeightPx = rect.height * group.scaleY;

            const widthFt = (currentWidthPx / actualScale).toFixed(1);
            const heightFt = (currentHeightPx / actualScale).toFixed(1);
            const sqft = (widthFt * heightFt).toFixed(1);

            const isSqFt = (group.toolType === 'sqft');
            text.set({
                text: isSqFt ? `${sqft} Sq Ft\n(${widthFt}' x ${heightFt}')` : `Carpet Cut\n${sqft} Sq Ft (${widthFt}' x ${heightFt}')`,
                scaleX: 1 / group.scaleX,
                scaleY: 1 / group.scaleY
            });

            fabricCanvas.renderAll();
        }

        function onObjectModified(e) {
            const group = e.target;
            if (!group || !group.isType('group')) return;

            const rect = group.item(0);
            const text = group.item(1);
            if (!rect || !text) return;

            const finalWidth = rect.width * group.scaleX;
            const finalHeight = rect.height * group.scaleY;

            rect.set({
                width: finalWidth,
                height: finalHeight,
                scaleX: 1,
                scaleY: 1
            });

            text.set({
                scaleX: 1,
                scaleY: 1
            });

            group.set({
                scaleX: 1,
                scaleY: 1
            });

            group.setCoords();
            fabricCanvas.renderAll();
        }

        function onMouseDblClick() {
            if (currentTool === 'poly' && isDrawingPoly) finishPolyDrawing();
        }

        function finishPolyDrawing() {
            if (polyPoints.length < 3) {
                resetPolyDrawing(); return;
            }

            const actualScale = SCALE_FACTOR * 1.5;
            let areaPx = 0; let cx = 0, cy = 0;

            for (let i = 0; i < polyPoints.length; i++) {
                let j = (i + 1) % polyPoints.length;
                areaPx += polyPoints[i].x * polyPoints[j].y;
                areaPx -= polyPoints[j].x * polyPoints[i].y;
                cx += polyPoints[i].x; cy += polyPoints[i].y;
            }
            areaPx = Math.abs(areaPx) / 2;
            const sqft = (areaPx / (actualScale * actualScale)).toFixed(1);

            cx /= polyPoints.length; cy /= polyPoints.length;

            const pattern = createHatchPattern('#2563eb', 135, hatchOpacity);
            const polygon = new fabric.Polygon(polyPoints, {
                fill: pattern, stroke: '#2563eb', strokeWidth: 2, objectCaching: false
            });

            const label = new fabric.Text(`${sqft} Sq Ft`, {
                fontSize: 14, fontWeight: 'bold', fill: '#1e3a8a',
                backgroundColor: 'rgba(255, 255, 255, 0.85)',
                originX: 'center', originY: 'center', left: cx, top: cy
            });

            const group = new fabric.Group([polygon, label], { selectable: true, toolType: 'poly' });
            resetPolyDrawing();
            fabricCanvas.add(group);
            recordAction([group]);
        }

        function resetPolyDrawing() {
            isDrawingPoly = false; polyPoints = [];
            document.getElementById('btn-finish-poly').style.display = 'none';
            if (activePolyLine && fabricCanvas) fabricCanvas.remove(activePolyLine);
            if (polyGuideLines.length > 0 && fabricCanvas) polyGuideLines.forEach(l => fabricCanvas.remove(l));
            polyGuideLines = []; activePolyLine = null;
            if (fabricCanvas) fabricCanvas.renderAll();
        }

        function recordAction(objects) { actionHistory.push(objects); }

        function undoLastAction() {
            if (actionHistory.length > 0 && fabricCanvas) {
                const lastObjects = actionHistory.pop();
                lastObjects.forEach(obj => fabricCanvas.remove(obj));
                fabricCanvas.renderAll();
                updateInstruction('Undid last markup action.');
            }
        }

        function deleteSelected() {
            if (!fabricCanvas) return;
            const activeObjects = fabricCanvas.getActiveObjects();
            if (activeObjects.length > 0) {
                activeObjects.forEach(obj => fabricCanvas.remove(obj));
                fabricCanvas.discardActiveObject();
                fabricCanvas.renderAll();
                updateInstruction('Deleted selected markup.');
            }
        }

        function clearDrawings() {
            if (fabricCanvas && confirm("Are you sure you want to clear all markups?")) {
                fabricCanvas.clear();
                if (pdfBgImage) fabricCanvas.setBackgroundImage(pdfBgImage, fabricCanvas.renderAll.bind(fabricCanvas));
                actionHistory = [];
                updateInstruction('All markups cleared.');
            }
        }

        function exportScaledPDF() {
            if (!pdfDoc) { alert("Please upload a PDF floorplan first."); return; }

            const { jsPDF } = window.jspdf;

            const savedZoom = currentZoom;
            resetZoom();

            const imgData = fabricCanvas.toDataURL({
                format: 'png',
                multiplier: 1.0
            });

            const orientation = originalPageWidthPt > originalPageHeightPt ? 'landscape' : 'portrait';

            const pdf = new jsPDF({
                orientation: orientation,
                unit: 'pt',
                format: [originalPageWidthPt, originalPageHeightPt]
            });

            pdf.addImage(imgData, 'PNG', 0, 0, originalPageWidthPt, originalPageHeightPt);
            pdf.save('MarkedUp_FloorPlan_14Scale.pdf');

            currentZoom = savedZoom;
            applyZoom();
            updateInstruction('Exported true-scale PDF document.');
        }

        function updateInstruction(text) {
            const bar = document.getElementById('instruction-bar');
            if (bar) bar.innerText = text;
        }
    </script>
</body>
</html>
