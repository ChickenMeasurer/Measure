<body>

    <header>
        <div class="header-title-group">

    <div class="main-container">

            <button class="btn btn-upload" onclick="document.getElementById('file-input').click()">

            </button>

            <div>

                    </button>
                    <button class="btn" id="tool-text" onclick="setTool('text')">

                    </button>
                </div>
            </div>

            <div>
                <div class="section-title">Measurement Tools</div>
                <div style="display: flex; flex-direction: column; gap: 6px;">
                    <button class="btn" id="tool-sqft" onclick="setTool('sqft')">
                        <span>📦 SqFt Box (Rectangle)</span>
                    </button>
                    <button class="btn" id="tool-poly" onclick="setTool('poly')">
                        <span>📐 Custom Area (L-Shape)</span>
                        <span class="kbd-badge">A</span>
                    </button>
                    <button class="btn btn-finish-poly" id="btn-finish-poly" onclick="finishPolyDrawing()">
                        <span>✅ Finish L-Shape</span>
                        <span class="kbd-badge">Enter</span>
                    </button>
                    <button class="btn" id="tool-carpet" onclick="setTool('carpet')">
                        <span>✂️ 12' Carpet Cut</span>
                        <span class="kbd-badge">C</span>
                    </button>
                    <button class="btn" id="tool-carpet-lock" onclick="toggleCarpetLock()">

        <main class="viewport" id="viewport">
            <div id="upload-prompt" class="empty-state">
                <h2>No Floorplan Loaded</h2>
                <p>Click "Upload PDF Floorplan" on the left to start.</p>
            </div>
            <div class="canvas-wrapper" id="canvas-wrapper" style="display: none;">
                <canvas id="pdf-canvas"></canvas>
            </div>

    <script>
        // Configure PDF.js Worker
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        const BASE_DPI_SCALE = 18; // 18 pixels per foot at 72 DPI PDF standard
        const RENDER_SCALE = 1.5;   // Render PDF at 1.5x for crisp text
        const PIXELS_PER_FOOT = BASE_DPI_SCALE * RENDER_SCALE; // 27 pixels = 1 foot on canvas
        const SQPX_PER_SQFT = PIXELS_PER_FOOT * PIXELS_PER_FOOT; // 729 sq px = 1 sq ft

        let pdfDoc = null;
        let fabricCanvas = null;
        let currentTool = 'select';
        let carpetLockMode = 'width'; // 'width' or 'height'
        let originalPageWidthPt = 612;
        let originalPageHeightPt = 792;

        // Custom L-Shape / Poly State
        let isDrawingPoly = false;
        let polyPoints = [];
        let activePolyLine = null;
        let polyGuideLines = [];

        // Rect Box / Carpet State
        let isDrawingBox = false;
        let origX = 0, origY = 0;
        let activeShape = null;

        // Action History Stack for Undo
        let actionHistory = [];

        window.addEventListener('load', () => {
            initFabric();
            setupEventListeners();
            setupKeyboardShortcuts();
        });

        function initFabric() {
            if (typeof fabric === 'undefined') {
                updateInstruction("Error: Drawing engine library failed to load. Check network firewall.");
                return;
            }

            fabricCanvas = new fabric.Canvas('pdf-canvas', {
                selection: true,
                preserveObjectStacking: true
            });

            fabricCanvas.on('mouse:down', onMouseDown);
            fabricCanvas.on('mouse:move', onMouseMove);
            fabricCanvas.on('mouse:dblclick', onMouseDblClick);
            fabricCanvas.on('mouse:up', onMouseUp);

            fabricCanvas.on('path:created', function(e) {
                recordAction([e.path]);
            });

            // Live updates during shape scaling
            fabricCanvas.on('object:scaling', function(e) {
                if (e.target && e.target.type === 'group' && e.target.measurementType) {
                    updateGroupLabel(e.target);
                }
            });

            // Normalize group dimensions after scaling completes
            fabricCanvas.on('object:modified', function(e) {
                if (e.target && e.target.type === 'group' && e.target.measurementType) {
                    normalizeGroup(e.target);
                }
            });

            // Recalculate mouse offsets when user scrolls viewport
            const viewport = document.getElementById('viewport');
            if (viewport) {
                viewport.addEventListener('scroll', () => { if (fabricCanvas) fabricCanvas.calcOffset(); });
            }
            window.addEventListener('resize', () => { if (fabricCanvas) fabricCanvas.calcOffset(); });
        }

        function setupEventListeners() {
            const fileInput = document.getElementById('file-input');
            if (fileInput) {
                fileInput.addEventListener('change', handleFileUpload);
            }
        }

        function setupKeyboardShortcuts() {
            window.addEventListener('keydown', (e) => {
                const activeObj = fabricCanvas ? fabricCanvas.getActiveObject() : null;
                const isEditingText = activeObj && activeObj.type === 'i-text' && activeObj.isEditing;
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || isEditingText) {
                    return;
                }

                const key = e.key.toLowerCase();
                if ((e.ctrlKey || e.metaKey) && key === 'z') {
                    e.preventDefault();
                    undoLastAction();
                } else if (key === 'c' && !e.ctrlKey) {
                    e.preventDefault();
                    setTool('carpet');
                } else if (key === 'w' && !e.ctrlKey) {
                    e.preventDefault();
                    toggleCarpetLock();
                } else if (key === 'a' && !e.ctrlKey) {
                    e.preventDefault();
                    setTool('poly');
                } else if (e.key === 'Enter') {
                    if (currentTool === 'poly' && isDrawingPoly) {
                        e.preventDefault();
                        finishPolyDrawing();
                    }
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    if (currentTool === 'poly' && isDrawingPoly) {
                        resetPolyDrawing();
                    } else {
                        setTool('select');
                    }
                } else if (e.key === 'Delete' || e.key === 'Backspace') {
                    e.preventDefault();
                    deleteSelected();
                }
            });
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file || file.type !== 'application/pdf') return;

            if (typeof pdfjsLib === 'undefined') {
                updateInstruction("PDF.js engine is unavailable. Please refresh page.");
                return;
            }

            updateInstruction("Loading PDF floorplan... Please wait.");
            const reader = new FileReader();
            reader.onload = function(evt) {
                const typedarray = new Uint8Array(evt.target.result);
                pdfjsLib.getDocument(typedarray).promise.then(pdf => {
                    pdfDoc = pdf;
                    renderPage(1);
                }).catch(err => {
                    updateInstruction("Error loading PDF: " + err.message);
                });
            };
            reader.readAsArrayBuffer(file);
        }

        function renderPage(pageNum) {
            pdfDoc.getPage(pageNum).then(page => {
                const unscaledViewport = page.getViewport({ scale: 1.0 });
                originalPageWidthPt = unscaledViewport.width;
                originalPageHeightPt = unscaledViewport.height;

                const viewport = page.getViewport({ scale: RENDER_SCALE });

                const offCanvas = document.createElement('canvas');
                offCanvas.width = viewport.width;
                offCanvas.height = viewport.height;
                const ctx = offCanvas.getContext('2d');

                page.render({ canvasContext: ctx, viewport: viewport }).promise.then(() => {
                    const imgDataUrl = offCanvas.toDataURL('image/png');

                    fabricCanvas.setWidth(viewport.width);
                    fabricCanvas.setHeight(viewport.height);

                    const wrapper = document.getElementById('canvas-wrapper');
                    wrapper.style.width = viewport.width + 'px';
                    wrapper.style.height = viewport.height + 'px';
                    wrapper.style.display = 'block';

                    fabric.Image.fromURL(imgDataUrl, function(img) {
                        fabricCanvas.setBackgroundImage(img, function() {
                            fabricCanvas.renderAll();
                            fabricCanvas.calcOffset();
                        });

                        document.getElementById('upload-prompt').style.display = 'none';
                        updateInstruction('PDF Loaded. Scale 1/4" = 1\'. Select a tool to begin drawing.');
                    });
                });
            });
        }

        function setTool(tool) {
            if (currentTool === 'poly' && tool !== 'poly') {
                resetPolyDrawing();
            }

            currentTool = tool;
            document.querySelectorAll('.sidebar .btn').forEach(b => {
                if (b.id && b.id.startsWith('tool-') && b.id !== 'tool-carpet-lock') {
                    b.classList.remove('active');
                }
            });

            const activeBtn = document.getElementById(`tool-${tool}`);
            if (activeBtn) activeBtn.classList.add('active');

            if (!fabricCanvas) return;

            fabricCanvas.isDrawingMode = (tool === 'pen');
            fabricCanvas.selection = (tool === 'select');

            // Make existing objects selectable only in 'select' mode
            const isSelectable = (tool === 'select');
            fabricCanvas.forEachObject(obj => {
                obj.selectable = isSelectable;
                obj.evented = isSelectable;
            });
            fabricCanvas.renderAll();

            if (tool === 'pen') {
                fabricCanvas.freeDrawingBrush.color = '#dc2626';
                fabricCanvas.freeDrawingBrush.width = 3;
                updateInstruction('Pen Mode: Click & drag to write/sketch.');
            } else if (tool === 'select') {
                updateInstruction('Select Mode: Click and drag handles to move or resize markups.');
            } else if (tool === 'sqft') {
                updateInstruction('SqFt Box: Click & drag rectangular room segments.');
            } else if (tool === 'poly') {
                updateInstruction('Custom L-Shape: Click corners sequentially. Double-click or press Enter when done.');
            } else if (tool === 'carpet') {
                updateInstruction(`12' Carpet Cut: Click & drag segment. Locked to 12' ${carpetLockMode}.`);
            } else if (tool === 'text') {
                updateInstruction('Text Tool: Click anywhere on drawing to insert notes.');
            }
        }

        function toggleCarpetLock() {
            carpetLockMode = (carpetLockMode === 'width') ? 'height' : 'width';
            document.getElementById('carpet-lock-label').innerText = `🔒 Lock: 12' ${carpetLockMode.charAt(0).toUpperCase() + carpetLockMode.slice(1)}`;
            if (currentTool !== 'carpet') {
                setTool('carpet');
            } else {
                updateInstruction(`12' Carpet Cut: Click & drag segment. Locked to 12' ${carpetLockMode}.`);
            }
        }

        function onMouseDown(opt) {
            if (!fabricCanvas || currentTool === 'select' || currentTool === 'pen') return;

            const pointer = fabricCanvas.getPointer(opt.e);

            if (currentTool === 'text') {
                const text = new fabric.IText('Note', {
                    left: pointer.x,
                    top: pointer.y,
                    fontSize: 18,
                    fontWeight: 'bold',
                    fill: '#0f172a',
                    backgroundColor: 'rgba(255, 255, 255, 0.9)'
                });
                fabricCanvas.add(text);
                recordAction([text]);
                setTool('select');
                fabricCanvas.setActiveObject(text);
                text.enterEditing();
                return;
            }

            if (currentTool === 'sqft' || currentTool === 'carpet') {
                isDrawingBox = true;
                origX = pointer.x;
                origY = pointer.y;

                let strokeColor = (currentTool === 'sqft') ? '#2563eb' : '#dc2626';
                let fillColor = (currentTool === 'sqft') ? 'rgba(37, 99, 235, 0.25)' : 'rgba(220, 38, 38, 0.25)';

                activeShape = new fabric.Rect({
                    left: origX,
                    top: origY,
                    width: 0,
                    height: 0,
                    fill: fillColor,
                    stroke: strokeColor,
                    strokeWidth: 2,
                    selectable: false,
                    evented: false
                });

                fabricCanvas.add(activeShape);
            } else if (currentTool === 'poly') {
                // If clicking near starting point with 3+ vertices, complete polygon
                if (polyPoints.length >= 3) {
                    const startPt = polyPoints[0];
                    const dist = Math.hypot(pointer.x - startPt.x, pointer.y - startPt.y);
                    if (dist < 15) {
                        finishPolyDrawing();
                        return;
                    }
                }

                if (!isDrawingPoly) {
                    isDrawingPoly = true;
                    polyPoints = [{ x: pointer.x, y: pointer.y }];

                    activePolyLine = new fabric.Line([pointer.x, pointer.y, pointer.x, pointer.y], {
                        stroke: '#2563eb',
                        strokeWidth: 2,
                        strokeDashArray: [4, 4],
                        selectable: false,
                        evented: false
                    });
                    fabricCanvas.add(activePolyLine);
                } else {
                    polyPoints.push({ x: pointer.x, y: pointer.y });
                    const prevPt = polyPoints[polyPoints.length - 2];
                    const guideLine = new fabric.Line([prevPt.x, prevPt.y, pointer.x, pointer.y], {
                        stroke: '#2563eb',
                        strokeWidth: 2,
                        selectable: false,
                        evented: false
                    });
                    polyGuideLines.push(guideLine);
                    fabricCanvas.add(guideLine);
                }

                // Display "Finish L-Shape" button when at least 3 points exist
                const finishBtn = document.getElementById('btn-finish-poly');
                if (finishBtn) finishBtn.style.display = (polyPoints.length >= 3) ? 'flex' : 'none';
            }
        }

        function onMouseMove(opt) {
            if (!fabricCanvas) return;
            const pointer = fabricCanvas.getPointer(opt.e);

            if (isDrawingBox && activeShape) {
                let w = pointer.x - origX;
                let h = pointer.y - origY;

                if (currentTool === 'carpet') {
                    const fixed12ftPx = 12 * PIXELS_PER_FOOT;
                    if (carpetLockMode === 'width') {
                        w = (w >= 0) ? fixed12ftPx : -fixed12ftPx;
                    } else {
                        h = (h >= 0) ? fixed12ftPx : -fixed12ftPx;
                    }
                }

                if (w < 0) activeShape.set({ left: pointer.x });
                if (h < 0) activeShape.set({ top: pointer.y });

                activeShape.set({
                    width: Math.abs(w),
                    height: Math.abs(h)
                });

                fabricCanvas.renderAll();
            } else if (isDrawingPoly && activePolyLine) {
                const lastPt = polyPoints[polyPoints.length - 1];
                activePolyLine.set({ x1: lastPt.x, y1: lastPt.y, x2: pointer.x, y2: pointer.y });
                fabricCanvas.renderAll();
            }
        }

        function onMouseUp() {
            if (isDrawingBox && activeShape) {
                isDrawingBox = false;

                if (activeShape.width < 5 && activeShape.height < 5) {
                    fabricCanvas.remove(activeShape);
                    activeShape = null;
                    return;
                }

                const widthFt = (activeShape.width / PIXELS_PER_FOOT).toFixed(1);
                const heightFt = (activeShape.height / PIXELS_PER_FOOT).toFixed(1);
                const sqft = ((activeShape.width * activeShape.height) / SQPX_PER_SQFT).toFixed(1);

                const labelText = (currentTool === 'sqft') 
                    ? `${sqft} Sq Ft\n(${widthFt}' x ${heightFt}')`
                    : `12' Carpet Cut\n${sqft} Sq Ft (${widthFt}' x ${heightFt}')`;

                const label = new fabric.Text(labelText, {
                    fontSize: 14,
                    fontWeight: 'bold',
                    fill: '#0f172a',
                    backgroundColor: 'rgba(255, 255, 255, 0.9)',
                    padding: 4,
                    textAlign: 'center',
                    originX: 'center',
                    originY: 'center',
                    left: activeShape.left + (activeShape.width / 2),
                    top: activeShape.top + (activeShape.height / 2)
                });

                const group = new fabric.Group([activeShape, label], {
                    selectable: (currentTool === 'select'),
                    evented: (currentTool === 'select'),
                    measurementType: currentTool
                });

                fabricCanvas.remove(activeShape);
                fabricCanvas.add(group);
                recordAction([group]);

                activeShape = null;
            }
        }

        function onMouseDblClick() {
            if (currentTool === 'poly' && isDrawingPoly) {
                finishPolyDrawing();
            }
        }

        function finishPolyDrawing() {
            if (polyPoints.length < 3) {
                resetPolyDrawing();
                return;
            }

            // Calculate area via Shoelace formula
            let areaPx = 0;
            let cx = 0, cy = 0;

            for (let i = 0; i < polyPoints.length; i++) {
                let j = (i + 1) % polyPoints.length;
                areaPx += polyPoints[i].x * polyPoints[j].y;
                areaPx -= polyPoints[j].x * polyPoints[i].y;
                cx += polyPoints[i].x;
                cy += polyPoints[i].y;
            }
            areaPx = Math.abs(areaPx) / 2;
            const sqftNum = parseFloat((areaPx / SQPX_PER_SQFT).toFixed(1));

            cx /= polyPoints.length;
            cy /= polyPoints.length;

            const polygon = new fabric.Polygon(polyPoints, {
                fill: 'rgba(37, 99, 235, 0.25)',
                stroke: '#2563eb',
                strokeWidth: 2,
                objectCaching: false
            });

            const label = new fabric.Text(`${sqftNum} Sq Ft`, {
                fontSize: 15,
                fontWeight: 'bold',
                fill: '#0f172a',
                backgroundColor: 'rgba(255, 255, 255, 0.9)',
                padding: 4,
                originX: 'center',
                originY: 'center',
                left: cx,
                top: cy
            });

            const group = new fabric.Group([polygon, label], {
                selectable: (currentTool === 'select'),
                evented: (currentTool === 'select'),
                measurementType: 'poly',
                originalSqFt: sqftNum
            });

            resetPolyDrawing();
            fabricCanvas.add(group);
            recordAction([group]);
        }

        function resetPolyDrawing() {
            isDrawingPoly = false;
            polyPoints = [];
            if (activePolyLine && fabricCanvas) fabricCanvas.remove(activePolyLine);
            if (polyGuideLines.length > 0 && fabricCanvas) {
                polyGuideLines.forEach(l => fabricCanvas.remove(l));
            }
            polyGuideLines = [];
            activePolyLine = null;

            const finishBtn = document.getElementById('btn-finish-poly');
            if (finishBtn) finishBtn.style.display = 'none';

            if (fabricCanvas) fabricCanvas.renderAll();
        }

        // --- Dynamic Label Recalculation & Counter-Scaling ---
        function updateGroupLabel(group) {
            if (!group || !group.measurementType) return;

            const scaleX = group.scaleX || 1;
            const scaleY = group.scaleY || 1;

            const effWidth = group.width * scaleX;
            const effHeight = group.height * scaleY;

            const widthFt = (effWidth / PIXELS_PER_FOOT).toFixed(1);
            const heightFt = (effHeight / PIXELS_PER_FOOT).toFixed(1);

            let labelText = '';
            if (group.measurementType === 'sqft') {
                const sqft = ((effWidth * effHeight) / SQPX_PER_SQFT).toFixed(1);
                labelText = `${sqft} Sq Ft\n(${widthFt}' x ${heightFt}')`;
            } else if (group.measurementType === 'carpet') {
                const sqft = ((effWidth * effHeight) / SQPX_PER_SQFT).toFixed(1);
                labelText = `12' Carpet Cut\n${sqft} Sq Ft (${widthFt}' x ${heightFt}')`;
            } else if (group.measurementType === 'poly') {
                const sqft = ((group.originalSqFt || 0) * scaleX * scaleY).toFixed(1);
                labelText = `${sqft} Sq Ft`;
            }

            const label = group.item(1);
            if (label) {
                label.set({
                    text: labelText,
                    scaleX: 1 / scaleX,
                    scaleY: 1 / scaleY
                });
            }
        }

        function normalizeGroup(group) {
            if (!group || !group.measurementType) return;

            const scaleX = group.scaleX || 1;
            const scaleY = group.scaleY || 1;

            if (scaleX === 1 && scaleY === 1) return;

            const effWidth = group.width * scaleX;
            const effHeight = group.height * scaleY;

            const rectOrShape = group.item(0);
            const label = group.item(1);

            if (group.measurementType === 'sqft' || group.measurementType === 'carpet') {
                if (rectOrShape) {
                    rectOrShape.set({
                        width: effWidth,
                        height: effHeight,
                        scaleX: 1,
                        scaleY: 1,
                        left: -effWidth / 2,
                        top: -effHeight / 2
                    });
                }
                if (label) {
                    label.set({
                        scaleX: 1,
                        scaleY: 1,
                        left: 0,
                        top: 0
                    });
                }
                group.set({
                    width: effWidth,
                    height: effHeight,
                    scaleX: 1,
                    scaleY: 1
                });
                group.addWithUpdate();
            } else if (group.measurementType === 'poly') {
                group.originalSqFt = (group.originalSqFt || 0) * scaleX * scaleY;
                if (label) {
                    label.set({
                        scaleX: 1,
                        scaleY: 1,
                        left: 0,
                        top: 0
                    });
                }
                group.set({
                    scaleX: 1,
                    scaleY: 1
                });
                group.addWithUpdate();
            }
            fabricCanvas.renderAll();
        }

        function recordAction(objects) {
            actionHistory.push(objects);
        }

        function undoLastAction() {
            if (actionHistory.length > 0 && fabricCanvas) {
                const lastObjects = actionHistory.pop();
                lastObjects.forEach(obj => fabricCanvas.remove(obj));
                fabricCanvas.renderAll();
                updateInstruction('Undid last markup action.');
            }
        }

        function deleteSelected() {
            if (!fabricCanvas) return;
            const activeObjects = fabricCanvas.getActiveObjects();
            if (activeObjects.length > 0) {
                activeObjects.forEach(obj => fabricCanvas.remove(obj));
                fabricCanvas.discardActiveObject();
                fabricCanvas.renderAll();
                updateInstruction('Deleted selected markup.');
            }
        }

        function clearDrawings() {
            if (fabricCanvas && actionHistory.length > 0) {
                resetPolyDrawing();
                fabricCanvas.getObjects().forEach(obj => fabricCanvas.remove(obj));
                actionHistory = [];
                updateInstruction('All markups cleared.');
            }
        }

        function exportScaledPDF() {
            if (!pdfDoc) {
                updateInstruction("Please upload a PDF floorplan first.");
                return;
            }

            if (typeof window.jspdf === 'undefined') {
                updateInstruction("PDF export library unavailable.");
                return;
            }

            const { jsPDF } = window.jspdf;

            // Generate full resolution image of background + markups
            const dataUrl = fabricCanvas.toDataURL({ format: 'png', multiplier: 1.0 });
            const orientation = originalPageWidthPt > originalPageHeightPt ? 'landscape' : 'portrait';

            // Create jsPDF document matched to native PDF point size (72 points = 1 inch)
            const pdf = new jsPDF({
                orientation: orientation,
                unit: 'pt',
                format: [originalPageWidthPt, originalPageHeightPt]
            });

            pdf.addImage(dataUrl, 'PNG', 0, 0, originalPageWidthPt, originalPageHeightPt);
            pdf.save('MarkedUp_FloorPlan_14Scale.pdf');
            updateInstruction('Exported true-scale PDF document.');
        }

        function updateInstruction(text) {
            const bar = document.getElementById('instruction-bar');
            if (bar) bar.innerText = text;
        }
    </script>
</body>
</html>
