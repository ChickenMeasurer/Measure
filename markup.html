<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flooring PDF Markup Tool</title>
    
    <!-- PDF.js for rendering PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    
    <!-- Fabric.js for interactive canvas drawing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

    <style>
        /* CSS Reset & Base Variables */
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #10b981;
            --secondary-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --bg-dark: #1f2937;
            --bg-light: #f3f4f6;
            --border: #e5e7eb;
            --text-main: #111827;
            --text-muted: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-main);
            background-color: var(--bg-light);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Layout */
        .sidebar {
            width: 280px;
            background-color: #ffffff;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 8px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .sidebar-header p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .sidebar-content {
            padding: 20px;
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .main-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .canvas-wrapper {
            flex-grow: 1;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px;
            background-color: #e5e7eb;
        }

        .status-bar {
            height: 30px;
            background-color: #ffffff;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        /* Buttons & Controls */
        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 10px;
            letter-spacing: 0.05em;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 10px 15px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background-color: #ffffff;
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            justify-content: flex-start;
        }

        .btn:hover {
            background-color: var(--bg-light);
        }

        .btn.active {
            background-color: #eff6ff;
            border-color: var(--primary);
            color: var(--primary);
            box-shadow: inset 0 0 0 1px var(--primary);
        }

        .btn-primary {
            background-color: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
            justify-content: center;
        }
        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-success {
            background-color: var(--secondary);
            color: #ffffff;
            border-color: var(--secondary);
            justify-content: center;
        }
        .btn-success:hover {
            background-color: var(--secondary-hover);
        }

        .btn-danger-outline {
            color: var(--danger);
            border-color: #fca5a5;
            background-color: #fef2f2;
            justify-content: center;
        }
        .btn-danger-outline:hover {
            background-color: #fee2e2;
            border-color: var(--danger);
        }

        /* Utility */
        input[type="file"] {
            display: none;
        }

        .empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--text-muted);
            pointer-events: none;
        }

        .empty-state h2 {
            margin-bottom: 8px;
            color: var(--text-main);
        }

        /* PDF Canvas Styles */
        .canvas-container {
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            background-color: #fff;
        }
    </style>
</head>
<body>

    <!-- Sidebar Tools -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h1>FloorMark Pro</h1>
            <p>Scale: 1/4" = 1'</p>
        </div>

        <div class="sidebar-content">
            <!-- Upload -->
            <div>
                <label class="btn btn-success">
                    <svg style="width:18px;height:18px;margin-right:8px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    Upload PDF Floorplan
                    <input type="file" id="pdf-upload" accept="application/pdf">
                </label>
            </div>

            <!-- Standard Tools -->
            <div>
                <div class="section-title">Standard Tools</div>
                <div class="btn-group">
                    <button class="btn active" id="tool-select" onclick="setTool('select')">👆 Select / Move</button>
                    <button class="btn" id="tool-pen" onclick="setTool('pen')">✏️ Pen Tool</button>
                    <button class="btn" id="tool-text" onclick="setTool('text')">🔤 Add Text</button>
                </div>
            </div>

            <!-- Measurement Tools -->
            <div>
                <div class="section-title">Measurement Tools</div>
                <div class="btn-group">
                    <button class="btn" id="tool-area" onclick="setTool('area')">📏 Square Footage Box</button>
                    <button class="btn" id="tool-carpet" onclick="setTool('carpet')">✂️ 12' Carpet Cut</button>
                    <button class="btn" id="btn-carpet-toggle" onclick="toggleCarpetOrientation()" style="font-size: 0.8rem; background: #f8fafc;">
                        🔄 Lock: 12' Height
                    </button>
                </div>
            </div>

            <div style="flex-grow: 1;"></div>

            <!-- Actions -->
            <div>
                <div class="section-title">Actions</div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="exportImage()">💾 Export as Image</button>
                    <button class="btn btn-danger-outline" onclick="clearAnnotations()">🗑️ Clear Drawings</button>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Canvas Area -->
    <main class="main-area">
        <div class="canvas-wrapper" id="canvas-wrapper">
            <div id="upload-prompt" class="empty-state">
                <h2>No PDF Loaded</h2>
                <p>Upload a PDF using the button on the left to begin.</p>
            </div>
            <!-- Canvas -->
            <canvas id="pdf-canvas"></canvas>
        </div>
        <div class="status-bar" id="status-msg">
            Ready. Upload a PDF to start marking up. Select items and press Delete/Backspace to remove them.
        </div>
    </main>

    <script>
        // Set PDF.js Worker Configuration safely
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        // Constants: 1/4" = 1' at 72 DPI means 1 foot = 18 pixels
        const PIXELS_PER_FOOT = 18;
        const CARPET_LOCK_PX = 12 * PIXELS_PER_FOOT; // 216 pixels

        // App State
        let currentTool = 'select';
        let carpetOrientation = 'horizontal'; // horizontal = lock height, vertical = lock width
        let isDrawing = false;
        let origX, origY;
        let activeShape = null;
        let activeText = null;

        // Initialize Fabric.js
        const canvas = new fabric.Canvas('pdf-canvas', {
            selection: false, // Prevents dragging a box over multiple items (protects text link sync)
            preserveObjectStacking: true
        });

        // Setup Pen
        canvas.freeDrawingBrush.color = '#ef4444'; // Red
        canvas.freeDrawingBrush.width = 3;

        // --- Event Listeners ---

        // File Upload
        document.getElementById('pdf-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            document.getElementById('status-msg').innerText = 'Loading PDF... Please wait.';
            const fileReader = new FileReader();
            
            fileReader.onload = function() {
                const typedarray = new Uint8Array(this.result);
                pdfjsLib.getDocument(typedarray).promise.then(function(pdf) {
                    pdf.getPage(1).then(function(page) {
                        const viewport = page.getViewport({ scale: 1.0 }); // 1.0 scale maintains 72 DPI math
                        
                        const offscreenCanvas = document.createElement('canvas');
                        const ctx = offscreenCanvas.getContext('2d');
                        offscreenCanvas.width = viewport.width;
                        offscreenCanvas.height = viewport.height;
                        
                        page.render({ canvasContext: ctx, viewport: viewport }).promise.then(function() {
                            canvas.setWidth(offscreenCanvas.width);
                            canvas.setHeight(offscreenCanvas.height);
                            
                            fabric.Image.fromURL(offscreenCanvas.toDataURL(), function(img) {
                                canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas));
                                document.getElementById('upload-prompt').style.display = 'none';
                                document.getElementById('status-msg').innerText = 'PDF Loaded. Select a tool to begin drawing.';
                            });
                        });
                    });
                }).catch(function(err) {
                    document.getElementById('status-msg').innerText = 'Error: ' + err.message;
                    console.error(err);
                });
            };
            fileReader.readAsArrayBuffer(file);
        });

        // Keydown (Delete Items)
        window.addEventListener('keydown', function(e) {
            if (e.key === 'Delete' || e.key === 'Backspace') {
                const activeObj = canvas.getActiveObject();
                if (activeObj && activeObj.isEditing) return; // Don't delete if typing text
                
                if (activeObj) {
                    if (activeObj.associatedText) canvas.remove(activeObj.associatedText);
                    if (activeObj.associatedRect) canvas.remove(activeObj.associatedRect);
                    canvas.remove(activeObj);
                    canvas.discardActiveObject();
                }
            }
        });

        // --- Tool Management ---

        function setTool(tool) {
            currentTool = tool;
            isDrawing = false;
            
            // Update buttons visually
            const tools = ['select', 'pen', 'text', 'area', 'carpet'];
            tools.forEach(function(t) {
                const btn = document.getElementById('tool-' + t);
                if (t === tool) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            // Set canvas modes
            canvas.isDrawingMode = (tool === 'pen');
            
            // Lock selectability of objects if we are in drawing modes to prevent accidental dragging
            const isDrawingTool = (tool === 'area' || tool === 'carpet');
            canvas.forEachObject(function(obj) {
                obj.selectable = !isDrawingTool;
                obj.evented = !isDrawingTool;
            });

            // Status message
            const msgs = {
                'select': 'Select Mode: Click and drag to move or resize objects. Press Delete to remove.',
                'pen': 'Pen Mode: Click and drag to freehand draw on the plans.',
                'text': 'Text Mode: Click anywhere on the drawing to type notes.',
                'area': 'Area Mode: Click and drag to calculate Square Footage.',
                'carpet': "Carpet Mode: Click and drag. One dimension is permanently locked to 12'."
            };
            document.getElementById('status-msg').innerText = msgs[tool];
        }

        function toggleCarpetOrientation() {
            carpetOrientation = (carpetOrientation === 'horizontal') ? 'vertical' : 'horizontal';
            const btn = document.getElementById('btn-carpet-toggle');
            
            if (carpetOrientation === 'horizontal') {
                btn.innerHTML = "🔄 Lock: 12' Height";
            } else {
                btn.innerHTML = "🔄 Lock: 12' Width";
            }
            
            if (currentTool !== 'carpet') {
                setTool('carpet');
            }
        }

        // --- Drawing Logic ---

        canvas.on('mouse:down', function(o) {
            if (currentTool === 'select' || currentTool === 'pen') return;

            const pointer = canvas.getPointer(o.e);
            origX = pointer.x;
            origY = pointer.y;

            if (currentTool === 'text') {
                const text = new fabric.IText('Type here...', {
                    left: origX,
                    top: origY,
                    fontFamily: 'system-ui, sans-serif',
                    fontSize: 24,
                    fill: '#dc2626', // Red
                    fontWeight: 'bold',
                    selectable: true
                });
                canvas.add(text);
                setTool('select');
                canvas.setActiveObject(text);
                text.enterEditing();
                text.selectAll();
                return;
            }

            if (currentTool === 'area' || currentTool === 'carpet') {
                isDrawing = true;
                
                const isArea = (currentTool === 'area');
                const fillColor = isArea ? 'rgba(37, 99, 235, 0.2)' : 'rgba(220, 38, 38, 0.2)'; // Blue or Red
                const strokeColor = isArea ? '#2563eb' : '#dc2626';

                activeShape = new fabric.Rect({
                    left: origX,
                    top: origY,
                    width: 0,
                    height: 0,
                    fill: fillColor,
                    stroke: strokeColor,
                    strokeWidth: 2,
                    selectable: false, // Cannot be selected while drawing
                    originX: 'left',
                    originY: 'top'
                });

                activeText = new fabric.Text('', {
                    left: origX,
                    top: origY,
                    fontFamily: 'system-ui, sans-serif',
                    fontSize: 16,
                    fill: '#111827', // Dark text
                    fontWeight: 'bold',
                    originX: 'center',
                    originY: 'center',
                    selectable: false
                });

                // Link objects together
                activeShape.isArea = isArea;
                activeShape.isCarpet = !isArea;
                activeShape.carpetOrientation = carpetOrientation;
                activeShape.associatedText = activeText;
                activeText.associatedRect = activeShape;

                canvas.add(activeShape, activeText);
            }
        });

        canvas.on('mouse:move', function(o) {
            if (!isDrawing || !activeShape) return;

            const pointer = canvas.getPointer(o.e);
            let w = Math.abs(pointer.x - origX);
            let h = Math.abs(pointer.y - origY);

            // Force 12 foot lock
            if (currentTool === 'carpet') {
                if (carpetOrientation === 'horizontal') {
                    h = CARPET_LOCK_PX;
                    activeShape.set({ top: origY }); 
                } else {
                    w = CARPET_LOCK_PX;
                    activeShape.set({ left: origX }); 
                }
            }

            activeShape.set({ width: w, height: h });

            // Allow dragging up and left
            if (currentTool === 'area') {
                if (pointer.x < origX) activeShape.set({ left: pointer.x });
                if (pointer.y < origY) activeShape.set({ top: pointer.y });
            } else if (currentTool === 'carpet') {
                if (carpetOrientation === 'horizontal') {
                    if (pointer.x < origX) activeShape.set({ left: pointer.x });
                } else {
                    if (pointer.y < origY) activeShape.set({ top: pointer.y });
                }
            }

            activeShape.setCoords();
            updateLinkedText(activeShape);
            canvas.renderAll();
        });

        canvas.on('mouse:up', function(o) {
            if (!isDrawing) return;
            isDrawing = false;
            
            if (activeShape) {
                // If shape is too small (accidental click), discard it
                if (activeShape.width < 10 && activeShape.height < 10) {
                    canvas.remove(activeShape);
                    canvas.remove(activeText);
                } else {
                    activeShape.selectable = true;
                    
                    // Constrain scale controls on carpet blocks to prevent ruining the 12' lock
                    if (activeShape.isCarpet) {
                        if (activeShape.carpetOrientation === 'horizontal') {
                            activeShape.setControlsVisibility({ mt: false, mb: false, tl: false, tr: false, bl: false, br: false });
                        } else {
                            activeShape.setControlsVisibility({ ml: false, mr: false, tl: false, tr: false, bl: false, br: false });
                        }
                    }
                }
            }
            activeShape = null;
            activeText = null;
            
            // Revert back to Select tool automatically after drawing a box
            setTool('select');
        });

        // --- Recalculating Text during Move/Scale ---

        canvas.on('object:scaling', function(e) { updateLinkedText(e.target); });
        canvas.on('object:moving', function(e) { updateLinkedText(e.target); });

        function updateLinkedText(obj) {
            if (!obj || !obj.associatedText) return;
            
            const text = obj.associatedText;
            
            // Calculate final size after Fabric's scaling multipliers
            const w = obj.width * obj.scaleX;
            const h = obj.height * obj.scaleY;
            const left = obj.left;
            const top = obj.top;

            if (obj.isArea) {
                const sqft = (w / PIXELS_PER_FOOT) * (h / PIXELS_PER_FOOT);
                text.set({ text: sqft.toFixed(1) + ' Sq Ft' });
            } else if (obj.isCarpet) {
                if (obj.carpetOrientation === 'horizontal') {
                    const len = (w / PIXELS_PER_FOOT);
                    text.set({ text: "12' x " + len.toFixed(1) + "'" });
                } else {
                    const len = (h / PIXELS_PER_FOOT);
                    text.set({ text: "12' x " + len.toFixed(1) + "'" });
                }
            }

            // Keep text centered
            text.set({
                left: left + (w / 2),
                top: top + (h / 2)
            });
            text.setCoords();
        }

        // --- Utility Functions ---

        function clearAnnotations() {
            if(confirm("Are you sure you want to clear all drawings?")) {
                canvas.getObjects().forEach(function(obj) {
                    canvas.remove(obj);
                });
                document.getElementById('status-msg').innerText = 'All drawings cleared.';
            }
        }

        function exportImage() {
            if (!canvas.backgroundImage) {
                alert("Please upload a PDF first.");
                return;
            }
            
            // Reset zoom/pan if any existed to get a clean export
            const dataURL = canvas.toDataURL({ format: 'png', quality: 1.0 });
            const link = document.createElement('a');
            link.download = 'floorplan-markup.png';
            link.href = dataURL;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

    </script>
</body>
</html>
