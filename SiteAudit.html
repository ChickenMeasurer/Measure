<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Site Audit | B&R Flooring</title>
    <style>
        :root {
            --bg-dark: #1e293b;
            --card-bg: #334155;
            --accent: #10b981; 
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            padding-bottom: 60px;
        }
        h2 { text-align: center; margin-bottom: 5px; }
        .sub-header { text-align: center; color: var(--text-muted); margin-bottom: 25px; }
        
        .job-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .job-card h3 { margin: 0 0 5px 0; color: var(--accent); }
        .job-card p { margin: 0 0 15px 0; color: var(--text-muted); font-size: 0.95rem; }
        .start-btn {
            width: 100%; padding: 15px; background: var(--accent); color: white;
            border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
        }

        #auditForm { display: none; }
        .audit-header {
            background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 20px;
            border-left: 5px solid var(--accent);
        }
        .audit-header h3 { margin: 0 0 5px 0; }
        .audit-header p { margin: 0; color: var(--text-muted); font-size: 0.9rem; }

        /* Updated Photo Slot Styling */
        .photo-slot {
            background: var(--card-bg); 
            border-radius: 10px; 
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #475569; 
        }
        .slot-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .slot-header h4 { margin: 0; font-size: 1rem; color: var(--text-main); }
        
        .camera-btn {
            background: #3b82f6; color: white; padding: 8px 15px; border-radius: 8px;
            border: none; font-size: 0.95rem; font-weight: bold; cursor: pointer;
            display: inline-flex; align-items: center; gap: 8px;
        }
        input[type="file"] { display: none; }
        
        /* New Horizontal Filmstrip for Multiple Photos */
        .thumbnail-row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
            min-height: 80px;
        }
        .thumbnail-row img {
            width: 80px; 
            height: 80px; 
            object-fit: cover; 
            border-radius: 8px; 
            border: 2px solid var(--accent);
            flex-shrink: 0;
            animation: popIn 0.3s ease-out;
        }
        
        /* Empty state styling */
        .empty-slot-text {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-style: italic;
            line-height: 80px;
            margin: 0;
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .save-btn {
            width: 100%; padding: 18px; background: #f59e0b; color: white;
            border: none; border-radius: 8px; font-size: 1.2rem; font-weight: bold; cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="jobSelector">
        <h2>📋 Site Audits</h2>
        <div class="sub-header">Select a project to begin walkthrough</div>
        <div id="jobList">
            <div style="text-align:center; color: #10b981;">Syncing today's measures...</div>
        </div>
    </div>

    <div id="auditForm">
        <button onclick="backToList()" style="background:none; border:none; color:#3b82f6; font-size:1rem; padding:0 0 15px 0; cursor:pointer;">&#8592; Back to Route</button>
        
        <div class="audit-header">
            <h3 id="auditName">Client Name</h3>
            <p id="auditAddress">123 Address Rd</p>
        </div>

        <h3 style="margin-bottom: 15px; border-bottom: 1px solid #334155; padding-bottom: 5px;">Required Photos</h3>
        
        <!-- 1. Overview -->
        <div class="photo-slot">
            <div class="slot-header">
                <h4>Home Overview</h4>
                <label class="camera-btn">
                    📷 Add Photo
                    <input type="file" accept="image/*" capture="environment" onchange="addPhoto(this, 'row-overview')">
                </label>
            </div>
            <div id="row-overview" class="thumbnail-row"><span class="empty-slot-text">No photos yet...</span></div>
        </div>

        <!-- 2. Transitions -->
        <div class="photo-slot">
            <div class="slot-header">
                <h4>Transitions</h4>
                <label class="camera-btn">
                    📷 Add Photo
                    <input type="file" accept="image/*" capture="environment" onchange="addPhoto(this, 'row-transitions')">
                </label>
            </div>
            <div id="row-transitions" class="thumbnail-row"><span class="empty-slot-text">No photos yet...</span></div>
        </div>

        <!-- 3. Subfloor -->
        <div class="photo-slot">
            <div class="slot-header">
                <h4>Subfloor (Vents)</h4>
                <label class="camera-btn">
                    📷 Add Photo
                    <input type="file" accept="image/*" capture="environment" onchange="addPhoto(this, 'row-subfloor')">
                </label>
            </div>
            <div id="row-subfloor" class="thumbnail-row"><span class="empty-slot-text">No photos yet...</span></div>
        </div>

        <!-- 4. Appliances -->
        <div class="photo-slot">
            <div class="slot-header">
                <h4>Appliances</h4>
                <label class="camera-btn">
                    📷 Add Photo
                    <input type="file" accept="image/*" capture="environment" onchange="addPhoto(this, 'row-appliances')">
                </label>
            </div>
            <div id="row-appliances" class="thumbnail-row"><span class="empty-slot-text">No photos yet...</span></div>
        </div>

        <!-- 5. Base Trim -->
        <div class="photo-slot">
            <div class="slot-header">
                <h4>Base Trim / Molding</h4>
                <label class="camera-btn">
                    📷 Add Photo
                    <input type="file" accept="image/*" capture="environment" onchange="addPhoto(this, 'row-trim')">
                </label>
            </div>
            <div id="row-trim" class="thumbnail-row"><span class="empty-slot-text">No photos yet...</span></div>
        </div>

        <button class="save-btn" onclick="packageAudit()">📦 Package & Save Audit</button>
    </div>

    <script>
        const API_URL = "https://us-central1-chickenmeasurer-37304.cloudfunctions.net/getBusySlots";

        async function fetchJobs() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                const listDiv = document.getElementById('jobList');
                listDiv.innerHTML = "";
                
                if (!data.busySlots || data.busySlots.length === 0) {
                    listDiv.innerHTML = "<div style='text-align:center;'>No jobs found.</div>";
                    return;
                }

                const today = new Date();
                const dayEvents = data.busySlots.filter(slot => {
                    const d = new Date(slot.start);
                    return d.getDate() === today.getDate() && d.getMonth() === today.getMonth();
                });

                if (dayEvents.length === 0) {
                    listDiv.innerHTML = "<div style='text-align:center;'>No measures scheduled for today.</div>";
                    return;
                }

                dayEvents.sort((a, b) => new Date(a.start) - new Date(b.start));

                dayEvents.forEach(event => {
                    const cleanTitle = event.summary.replace("Measure: ", "");
                    const cardHTML = `
                        <div class="job-card">
                            <h3>${cleanTitle}</h3>
                            <p>📍 ${event.location}</p>
                            <button class="start-btn" onclick="openAudit('${cleanTitle.replace(/'/g, "\\'")}', '${event.location.replace(/'/g, "\\'")}')">Start Audit</button>
                        </div>
                    `;
                    listDiv.innerHTML += cardHTML;
                });

            } catch (error) {
                document.getElementById('jobList').innerHTML = "<div style='text-align:center;'>Error loading jobs.</div>";
            }
        }

        function openAudit(name, address) {
            document.getElementById('jobSelector').style.display = 'none';
            document.getElementById('auditForm').style.display = 'block';
            document.getElementById('auditName').innerText = name;
            document.getElementById('auditAddress').innerText = address;
        }

        function backToList() {
            document.getElementById('auditForm').style.display = 'none';
            document.getElementById('jobSelector').style.display = 'block';
        }

        // New function to append multiple photos in a row
        function addPhoto(input, rowId) {
            if (input.files && input.files[0]) {
                const rowContainer = document.getElementById(rowId);
                
                // Clear the "No photos yet..." text on the first photo
                if (rowContainer.querySelector('.empty-slot-text')) {
                    rowContainer.innerHTML = '';
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    const newImg = document.createElement('img');
                    newImg.src = e.target.result;
                    rowContainer.appendChild(newImg);
                }
                reader.readAsDataURL(input.files[0]);
                
                // Reset the input value so you can take another picture right away
                input.value = "";
            }
        }

        function packageAudit() {
            alert("Ready for the compression & upload phase!");
        }

        fetchJobs();
    </script>
</body>
</html>
